[[annotations]]
path = [
    # Root project files
    ".clang-format",
    ".clangd",
    ".gitignore",
    ".gitmodules",
    "bsb_common_env_init.scons",
    "fbt",
    "fbt.cmd",
    "fbt-project.json",
    "LICENSE",
    "project.scons",
    "README.md",
    "run",

    # CI/CD infrastructure
    ".github/**",
    ".forgejo/**",

    # Main firmware: applications, targets, scripts, tests
    "applications/**",
    "targets/**",
    "scripts/**",
    "tests/**",

    # Assets: artwork, animations, sounds, UI
    "assets/README.md",
    "assets/animations/**",
    "assets/images/**",
    "assets/sounds/**",
    "assets_bkp/**",
    "assets/shared/**",
    "assets/frontend/**",
    # frontend-build: single catch-all for build artefacts with dynamic names
    "assets/frontend-build/**",

    # lib/ — first-party library code
    "lib/*.scons",
    "lib/anim_file/**",
    "lib/cli/**",
    "lib/containers/**",
    "lib/drivers/**",
    "lib/firmware_applications_si917/**",
    "lib/firmware_applications_u5/**",
    "lib/flipper_application/**",
    "lib/flipper_format/**",
    "lib/formatters/**",
    "lib/lvgl_addons/**",
    "lib/mbedtls_patch/**",
    "lib/netstat/**",
    "lib/network/SConscript",
    "lib/setting_provider/**",
    "lib/settings_helpers/**",
    "lib/stb/stb.c",
    "lib/stb/stb.h",
    "lib/stb/SConscript",
    "lib/toolbox/**",
    "lib/sl_glue/src/sl_debug.c",

    # fbt_layers/core_libs — build scripts and first-party libraries (submodule)
    "fbt_layers/core_libs/*.scons",
    "fbt_layers/core_libs/lib/*.scons",
    "fbt_layers/core_libs/lib/bit_lib/**",
    "fbt_layers/core_libs/lib/datetime/**",
    "fbt_layers/core_libs/lib/version/**",
    "fbt_layers/core_libs/lib/print/wrappers.c",
    "fbt_layers/core_libs/lib/print/wrappers.h",
    "fbt_layers/core_libs/inc/**",

    # fbt_layers/freertos — build scripts and FreeRTOS-glue (submodule)
    "fbt_layers/freertos/*.scons",
    "fbt_layers/freertos/lib/*.scons",
    "fbt_layers/freertos/lib/FreeRTOS-glue/**",
]
SPDX-FileCopyrightText = "2024-2026 Flipper FZCO"
SPDX-License-Identifier = "GPL-2.0-or-later"

