name: Create pull request on upstream
on:
  pull_request:
    types: [opened, reopened]

jobs:
  sync:
    name: Push branch to upstream
    runs-on: docker
    steps:
      - name: Install jq
        run: |
          apt-get update && apt-get install jq -y

      - name: Create pull request
        env:
          GH_EVENT_PATH: ${{ github.event_path }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.REPO_UPSTREAM_TOKEN }}
          REPO_UPSTREAM: ${{ vars.REPO_UPSTREAM }}
        run: |
          # Extract PR title and body directly from the event file to avoid shell interpretation
          TITLE=$(jq -r '.pull_request.title' "$GH_EVENT_PATH")
          BODY=$(jq -r '.pull_request.body // ""' "$GH_EVENT_PATH")
          
          # Create payload with properly escaped JSON values
          jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg head "$HEAD_REF" \
            --arg base "$BASE_REF" \
            '{title: $title, body: $body, head: $head, base: $base}' > payload.json
          
          # Send the request with proper JSON
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO_UPSTREAM/pulls" \
            --data @payload.json
