name: Create pull request on upstream
on:
  pull_request:
    types: [opened]

jobs:
  sync:
    name: Push branch to upstream
    runs-on: docker
    steps:
      - name: Create pull request
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.REPO_UPSTREAM_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ vars.REPO_UPSTREAM }}/pulls \
            -d '{
              "title": "${{ github.event.pull_request.title || "Pull request" }}",
              "head": "${{ github.head.ref }}",
              "base": "${{ github.base_ref }}"
            }'
