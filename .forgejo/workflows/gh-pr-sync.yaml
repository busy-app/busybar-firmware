name: Create pull request on upstream
on:
  pull_request:
    types: [opened, reopened]

jobs:
  sync:
    name: Push branch to upstream
    runs-on: docker
    steps:
      - name: Install jq
        run: |
          apt-get update && apt-get install jq -y

      - name: Create pull request
        run: |
          # Use jq to properly construct the JSON payload
          PR_TITLE=$(jq -Rs . <<< "${{ github.event.pull_request.title }}")
          
          JSON_PAYLOAD=$(jq -n \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg head "${{ github.head_ref }}" \
            --arg base "${{ github.base_ref }}" \
            '{title: $title, head: $head, base: $base}')
          
          # Send the request with proper JSON
          curl --fail -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{secrets.REPO_UPSTREAM_TOKEN}}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ vars.REPO_UPSTREAM }}/pulls \
            -d "$JSON_PAYLOAD"
