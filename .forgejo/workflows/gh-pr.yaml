name: Create pull request
on:
  pull_request:
    types: [opened]
    branches:
      - "*/*"

jobs:
  create_pr:
    name: Create pull request
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create pull request
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.REPO_UPSTREAM_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ vars.REPO_UPSTREAM }}/pulls \
            -d '{
              "title": "Sync branch with upstream",
              "head": "${{ github.ref }}",
              "base": "${{ github.base_ref }}"
            }'
