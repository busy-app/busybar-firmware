<!DOCTYPE html>
<html lang="en">

<body>
    <h1>WebServer test</h1>
    <div style="height: 0.3em;">&nbsp;</div>
    <button id="btn1">Get FW version</button>
    <br />
    <button id="btn_led_on">LED ON (GET)</button>
    <button id="btn_led_off">LED OFF (GET)</button>
    <br />
    <button id="btn_led_json_on">LED ON (POST)</button>
    <button id="btn_led_json_off">LED OFF (POST)</button>
    <br />
    <button id="btn_ws">WS open/close</button>
    <input id="message" type="text" placeholder="Type message" style="width: 20em;" />
    <button id="btn_ws_send">WS send</button>
    <br />
    <div id="wrapper">
        <input type="file" id="el1" style="display: none" />
        <button id="el2">Upload file...</button>
        <div id="el3"></div>
    </div>
    <br />
    <button id="btn_display_1">Show image (front)</button>
    <button id="btn_display_2">Show image (back)</button>

    <div style="margin-top: 1em;">Action log:</div>
    <div id="log" style="background: #eee; height: 10em; padding: 0.5em; overflow:auto;">
        <div>
</body>
<script>
    var E = function (id) { return document.getElementById(id); };
    var btn1 = E('btn1'), msglog = E('log');
    var btn_led_on = E('btn_led_on'), btn_led_off = E('btn_led_off');
    var btn_led_json_on = E('btn_led_json_on'), btn_led_json_off = E('btn_led_json_off');

    var log = text => msglog.innerHTML += text + '<br/>\n';

    btn1.onclick = ev => fetch('/api/version')
        .then(r => r.json())
        .then(r => {
            console.log(r);
            log('GET /api/version: ' + JSON.stringify(r))
        })
        .catch(err => console.log(err));

    const set_led = (state) =>
        fetch('/api/led?state=' + state)
            .then(r => r.json())
            .then(r => {
                console.log(r);
                log('GET /api/led?state=' + state + ': ' + JSON.stringify(r))
            })
            .catch(err => console.log(err));

    btn_led_on.onclick = ev => set_led(1);
    btn_led_off.onclick = ev => set_led(0);

    const set_led_json = (state) =>
        fetch('/api/led', { method: 'POST', body: JSON.stringify({ "state": state }) })
            .then(r => r.json())
            .then(r => {
                console.log(r);
                log('POST /api/led: ' + JSON.stringify(r))
            })
            .catch(err => console.log(err));

    btn_led_json_on.onclick = ev => set_led_json(1);
    btn_led_json_off.onclick = ev => set_led_json(0);

    const show_image = (path, display) =>
        fetch('/api/display?path=' + path + '&display=' + display)
            .then(r => r.json())
            .then(r => {
                console.log(r);
                log('GET /api/display?path = ' + path + ' &display=' + display + ': ' + JSON.stringify(r))
            })
            .catch(err => console.log(err));

    btn_display_1.onclick = ev => show_image('/ext/www/upload/test.png', "front");
    btn_display_2.onclick = ev => show_image('/ext/www/upload/test.png', "back");

    var ws
    btn_ws.onclick = function () {
        if (ws) { ws.close(); ws = null; return; }
        ws = new WebSocket('/ws_test');
        if (!ws) return;
        ws.onopen = function () { log('WS: CONNECTION OPENED'); }
        ws.onmessage = function (ev) { log('WS: RECEIVED: ' + ev.data); }
        ws.onerror = function (ev) { log('WS: ERROR: ' + ev); }
        ws.onclose = function () { log('WS: CONNECTION CLOSED'); ws = null; }
    };
    btn_ws_send.onclick = function () {
        if (!ws) return;
        log('WS: SENT: ' + message.value);
        ws.send(message.value);
    }

    // Helper function to display upload status
    var setStatus = function (text) {
        document.getElementById('el3').innerText = text;
    };

    // When user clicks on a button, trigger file selection dialog
    var button = document.getElementById('el2');
    button.onclick = function (ev) {
        input.click();
    };

    // Send a large blob of data chunk by chunk
    var sendFileData = function (name, data, chunkSize) {
        var sendChunk = function (offset) {
            var chunk = data.subarray(offset, offset + chunkSize) || '';
            var opts = { method: 'POST', body: chunk };
            var url = '/upload?offset=' + offset + '&file=' + encodeURIComponent(name);
            var ok;
            setStatus(
                'Uploading ' + name + ', bytes ' + offset + '..' +
                (offset + chunk.length) + ' of ' + data.length);
            fetch(url, opts)
                .then(function (res) {
                    if (res.ok && chunk.length > 0) sendChunk(offset + chunk.length);
                    ok = res.ok;
                    return res.text();
                })
                .then(function (text) {
                    if (!ok) setStatus('Error: ' + text);
                });
        };
        sendChunk(0);
    };

    // If user selected a file, read it into memory and trigger sendFileData()
    var input = document.getElementById('el1');
    input.onchange = function (ev) {
        if (!ev.target.files[0]) return;
        var f = ev.target.files[0], r = new FileReader();
        r.readAsArrayBuffer(f);
        r.onload = function () {
            ev.target.value = '';
            sendFileData(f.name, new Uint8Array(r.result), 64 * 1024);
        };
    };
</script>

</html>
