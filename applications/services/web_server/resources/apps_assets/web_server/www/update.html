<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmware Update</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="file"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            /* Light grey */
            border-top: 4px solid #007bff;
            /* Blue */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            /* Center the spinner */
            display: none;
            /* Hidden by default */
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Firmware Update</h1>
        <form id="updateForm">
            <div>
                <label for="packageName">Package Name:</label>
                <input type="text" id="packageName" name="packageName" value="firmware" required
                    pattern="^[a-zA-Z0-9._-]+$" title="Alphanumeric, period, underscore, hyphen allowed.">
            </div>
            <div>
                <label for="firmwareFile">Firmware File (.tar):</label>
                <input type="file" id="firmwareFile" name="firmwareFile" accept=".tar" required>
            </div>
            <button type="submit">Upload Firmware</button>
        </form>
        <div id="spinner" class="spinner"></div> <!-- Spinner element -->
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('updateForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const packageName = document.getElementById('packageName').value;
            const firmwareFile = document.getElementById('firmwareFile').files[0];
            const statusDiv = document.getElementById('status');
            const spinner = document.getElementById('spinner');

            statusDiv.textContent = '';
            statusDiv.className = '';
            spinner.style.display = 'none'; // Ensure spinner is hidden initially

            if (!packageName) {
                statusDiv.textContent = 'Package Name is required.';
                statusDiv.className = 'error';
                return;
            }
            if (!firmwareFile) {
                statusDiv.textContent = 'Firmware File is required.';
                statusDiv.className = 'error';
                return;
            }

            const formData = new FormData();
            formData.append('firmware', firmwareFile); // Key doesn't matter for octet-stream, but useful for FormData

            const url = `/api/v0/update?name=${encodeURIComponent(packageName)}`;
            statusDiv.textContent = 'Uploading...';
            spinner.style.display = 'block'; // Show spinner

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: firmwareFile, // Send the file directly as the body
                    headers: {
                        'Content-Type': 'application/octet-stream'
                    }
                });

                const responseData = await response.json();

                if (response.ok) {
                    statusDiv.textContent = `Success: ${responseData.message || 'Update initiated. Device will reboot.'}`;
                    statusDiv.className = 'success';
                } else {
                    statusDiv.textContent = `Error ${response.status}: ${responseData.error || 'Unknown error occurred.'}`;
                    statusDiv.className = 'error';
                }
            } catch (error) {
                console.error('Upload error:', error);
                statusDiv.textContent = 'Upload failed. See console for details.';
                statusDiv.className = 'error';
            } finally {
                spinner.style.display = 'none'; // Hide spinner when done
            }
        });
    </script>
</body>

</html>
