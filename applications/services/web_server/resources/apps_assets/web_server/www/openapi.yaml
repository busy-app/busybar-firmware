openapi: 3.0.3
info:
  title: BSB HTTP API
  description: HTTP API for BSB web server
  version: 0.0.1
  contact:
    name: tbd

paths:
  /api/v0/led:
    get:
      tags:
        - Hardware
      summary: Get LED state
      description: Retrieves the current LED state
      operationId: getLedState
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: LED state (0 for off, 1 for on) - alternative to JSON body
      responses:
        '200':
          description: LED state retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedStateResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags:
        - Hardware
      summary: Set LED state
      description: Sets the LED state via query parameter or JSON body
      operationId: setLedState
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: LED state (0 for off, 1 for on) - alternative to JSON body
      requestBody:
        required: false
        description: LED state as JSON (alternative to query parameter)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedStateRequest'
      responses:
        '200':
          description: LED state set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedStateResponse'
        '400':
          description: Invalid state parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v0/version:
    get:
      tags:
        - System
      summary: Get firmware version information
      description: Retrieves firmware version, branch, build date, and commit information
      operationId: getVersion
      responses:
        '200':
          description: Version information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v0/update:
    post:
      tags:
        - System
      summary: Update firmware
      description: Uploads a firmware update package (TAR file) and initiates the update process.
      operationId: updateFirmware
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+$'
          description: Name for the update package. The update will be unpacked to /ext/update/<name>.
          example: "firmware"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Firmware update TAR file.
      responses:
        '200':
          description: Update initiated successfully. The device will reboot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters, invalid TAR file, or update preparation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Update package too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error during update process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v0/assets/upload:
    post:
      tags:
        - Assets
      summary: Upload asset file with app ID
      description: Uploads a file to a specific app's assets directory
      operationId: uploadAssetWithAppId
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+$'
          description: Application ID for organizing assets
          example: "my_app"
        - name: file
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+$'
          description: Filename for the uploaded asset
          example: "data.png"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: File data to upload as raw binary content
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid parameters or upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Assets
      summary: Delete app assets
      description: Deletes all assets for a specific app ID
      operationId: deleteAppAssets
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+$'
          description: Application ID whose assets should be deleted
          example: "my_app"
      responses:
        '200':
          description: Assets deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid app_id or deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v0/display/draw:
    post:
      tags:
        - Assets
      summary: Draw on display
      description: |
        Sends drawing data to the display.
        Supports JSON-defined display elements.
      operationId: drawOnDisplay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisplayElements'
      responses:
        '200':
          description: Drawing command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid drawing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Display error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Assets
      summary: Clear display
      description: Clears the display and stops the Canvas application if running
      operationId: clearDisplay
      responses:
        '200':
          description: Display cleared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Display error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v0/audio/play:
    post:
      tags:
        - Assets
      summary: Play audio file
      description: |
        Plays an audio file from the assets directory.
        Supported formats include .snd files.
      operationId: playAudio
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._-]+$'
          description: Application ID for organizing assets
          example: "my_app"
        - name: path
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9._/-]+$'
          description: Path to audio file within app's assets directory
          example: "data.snd"
      responses:
        '200':
          description: Audio playback started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid file path or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Audio system error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Assets
      summary: Stop audio playback
      description: Stops any currently playing audio
      operationId: stopAudio
      responses:
        '200':
          description: Audio playback stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Audio system error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ws_test:
    get:
      tags:
        - WebSocket
      summary: WebSocket test endpoint
      description: |
        WebSocket connection for real-time communication and testing.
        Upgrade from HTTP to WebSocket protocol is required.
      operationId: connectWebSocket
      responses:
        '101':
          description: WebSocket connection established
        '400':
          description: WebSocket upgrade failed
          content:            
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          description: Upgrade required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v0/wifi/enable:
    post:
      tags:
        - Wifi
      description: Enables wifi module
      parameters: []
      responses:
        '200':
          description: Wifi enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Wifi already enabled
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

  /api/v0/wifi/disable:
    post:
      tags:
        - Wifi
      description: Disables wifi module
      parameters: []
      responses:
        '200':
          description: Wifi disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Not initialized
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

  /api/v0/wifi/status:
    get:
      tags:
        - Wifi
      description: Returns current wifi status
      parameters: []
      responses:
        '200':
          description: OK

  /api/v0/wifi/connect:
    post:
      tags:
        - Wifi
      description: Attempts to connect to wifi using config
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequestConfig"
      responses:
        '200':
          description: Network connection established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Wifi already connected
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

  /api/v0/wifi/disconnect:
    post:
      tags:
        - Wifi
      description: Attempts to connect to wifi using config
      parameters: []
      responses:
        '200':
          description: Network connection terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Command issued in an invalid state
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

  /api/v0/wifi/networks:
    get:
      tags:
        - Wifi
      description: Scans environment for available wifi networks
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkResponse"
        '400':
          description: Wifi already connected
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
    
  /api/v0/wifi/forget:
    post:
      tags:
        - Wifi
      description: Forgets saved Wifi config
      parameters: []
      responses:
        '400':
          description: Not implemented
          content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

components:
  schemas:
    LedState:
      type: object
      properties:
        state:
          type: integer
          enum: [0, 1]
          description: Current LED state (0 for off, 1 for on)
      required:
        - state
      example:
        state: 1

    LedStateRequest:
      type: object
      properties:
        state:
          type: integer
          enum: [0, 1]
          description: LED state (0 for off, 1 for on)
      required:
        - state
      example:
        state: 1

    SuccessResponse:
      type: object
      properties:
        result:
          type: string
          example: "OK"
          description: Success status message
      required:
        - result

    LedStateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            state:
              type: integer
              enum: [0, 1]
              description: Current LED state (0 for off, 1 for on)
          required:
            - state

    VersionInfo:
      type: object
      properties:
        branch:
          type: string
          description: Git branch name
          example: "main"
        version:
          type: string
          description: Firmware version
          example: "1.0.0"
        build_date:
          type: string
          description: Build date
          example: "2024-01-01"
        commit_hash:
          type: string
          description: Git commit hash (may include -dirty suffix)
          example: "abc123def456-dirty"
      required:
        - branch
        - version
        - build_date
        - commit_hash
      example:
        branch: "main"
        version: "1.0.0"
        build_date: "2024-01-01"
        commit_hash: "abc123def456"

    BinaryUpload:
      type: string
      format: binary
      description: Binary data upload

    FileUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: File to upload
      required:
        - file

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code
      required:
        - error
      example:
        error: "Invalid parameter"
        code: 400

    DisplayElements:
      type: object
      properties:
        app_id:
          type: string
          pattern: '^[a-zA-Z0-9._-]+$'
          description: Application ID for organizing assets
          example: "my_app"
        elements:
          type: array
          items:
            $ref: '#/components/schemas/DisplayElement'
          description: Array of elements to display
      required:
        - app_id
        - elements
      example:
        app_id: "my_app"
        elements:
          - id: "0"
            timeout: 5
            type: "text"
            text: "Hello, world!"
            x: 0
            y: 0
            display: "front"
          - id: "1"
            timeout: 6
            type: "image"
            path: "data.png"
            x: 0
            y: 0
            display: "back"
      
    DisplayElement:
      type: object
      required:
        - id
        - type
        - x
        - y
      properties:
        id:
          type: string
          description: Unique identifier for the element
        timeout:
          type: integer
          minimum: 0
          description: Time in seconds the element should be displayed (0 for no timeout)
        type:
          type: string
          enum: [text, image]
          description: Type of display element
        x:
          type: integer
          description: X coordinate for placement on display
        y:
          type: integer
          description: Y coordinate for placement on display
        display:
          type: string
          enum: [front, back]
          description: Which display to show the element on (for dual-display devices)
          default: front
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextElement'
          image: '#/components/schemas/ImageElement'
      
    TextElement:
      allOf:
        - $ref: '#/components/schemas/DisplayElement'
        - type: object
          required:
            - text
          properties:
            text:
              type: string
              description: Text content to display
            
    ImageElement:
      allOf:
        - $ref: '#/components/schemas/DisplayElement'
        - type: object
          required:
            - path
          properties:
            path:
              type: string
              pattern: '^[a-zA-Z0-9._/-]+$'
              description: Path to the image file in the app's assets

    WifiSecurityMethod:
      type: string
      example: "WPA3"
      enum:
        [
          Open,
          WPA,
          WPA2,
          WEP,
          WPA (Enterprise),
          WPA2 (Enterprise),
          WPA/WPA2,
          WPA3,
          WPA2/WPA3,
          WPA3 (Enterprise),
          WPA2/WPA3 (Enterprise),
        ]

    WifiIpMethod:
      type: string
      example: "dhcp"
      enum: ["dhcp", "static"]

    WifiIpType:
      type: string
      example: "ipv4"
      enum: ["ipv4", "ipv6"]

    Network:
      type: object
      properties:
        SSID:
          type: string
          example: "42"
        Security:
          $ref: "#/components/schemas/WifiSecurityMethod"
        RSSI:
          type: integer
          example: "58"

    StatusResponse:
      type: object
      properties:
        State:
          type: string
          example: enabled
          enum:
            - disabled
            - enabled
            - connected
        SSID:
          type: string
          example: Your_WIFI_SSID
        Security:
          $ref: "#/components/schemas/WifiSecurityMethod"
        ip_config:
          type: object
          properties:
            ip_method:
              $ref: "#/components/schemas/WifiIpMethod"
            ip_type:
              $ref: "#/components/schemas/WifiIpType"
            address:
              type: string
              example: 192.168.50.5

    ConnectRequestConfig:
      type: object
      properties:
        SSID:
          type: string
          example: Your_WIFI_SSID
        Password:
          type: string
          example: Your_WIFI_Pass
        Security:
          $ref: "#/components/schemas/WifiSecurityMethod"
        ip_config:
          type: object
          properties:
            ip_method:
              $ref: "#/components/schemas/WifiIpMethod"
            ip_type:
              $ref: "#/components/schemas/WifiIpType"
            address:
              type: string
              example: 192.168.50.5
            mask:
              type: string
              example: 255.255.255.0
            gateway:
              type: string
              example: 192.168.50.1

    NetworkResponse:
      type: object
      properties:
        count:
          type: integer
          example: 2
        networks:
          type: array
          items:
            $ref: "#/components/schemas/Network"

tags:
  - name: System
    description: System information and control
  - name: Hardware
    description: Low-level hardware control
  - name: Assets
    description: Asset file management and display control
  - name: WebSocket
    description: Real-time communication via WebSocket
  - name: Wifi
    description: Allows to operate with Wifi
