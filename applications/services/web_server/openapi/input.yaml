tags:
- name: Input
  description: Input events

paths:
  /api/input:
    post:
      tags:
        - Input
      summary: Send input event
      description: Send single key press event
      operationId: setInputKey
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                "up",
                "down",
                "ok",
                "back",
                "start",
                "busy",
                "custom",
                "off",
                "apps",
                "settings",
              ]
          description: Key name
          example: "ok"
      responses:
        "200":
          description: Input event sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/input/switch:
    get:
      tags:
        - Input
      summary: Get switch position
      description: |
        Current position of the mode switch as seen by the firmware, i.e. the position that selects the running app.
        A position injected with POST /api/input is reported here even though the physical switch has not moved;
        the physical position is picked up again when the switch is moved.
        "unknown" is returned only briefly after boot, before the position has been determined.
        The full state snapshot of /api/status/ws carries the same position as a SwitchEvent.
      operationId: getInputSwitch
      responses:
        "200":
          description: Current switch position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InputSwitchResponse"

schemas:
  InputSwitchResponse:
    type: object
    properties:
      position:
        type: string
        example: "busy"
        enum: ["busy", "custom", "off", "apps", "settings", "unknown"]
        description: Mode switch position
    required:
      - position
