tags:
- name: Streaming
  description: Screen streaming

paths:
  /api/status/ws:
    get:
      tags:
        - Streaming
      summary: Device status streaming WebSocket endpoint
      description: |
        WebSocket connection for real-time device status and screen streaming.
        Upgrade from HTTP to WebSocket protocol is required.
        After connection, client must enable streaming by sending JSON: {"enable": true}
      x-local-only: true
      operationId: connectWebSocket
      responses:
        "101":
          description: WebSocket connection established
        "400":
          description: Exceed max clients count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/screen:
    get:
      tags:
        - Streaming
      summary: Get single frame for requested screen
      parameters:
        - name: display
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 1
          description: Type of the display Front = 0, Back = 1
          example: 0
      responses:
        "200":
          description: OK
          content:
            image/bmp:
              schema:
                $ref: "#/components/schemas/ScreenResponse"
        "400":
          description: Wrong display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

schemas:
  ScreenResponse:
    type: string
    description: Frame for requested display encoded in base64
    format: base64
