tags:
- name: Busy
  description: BUSY timer control

paths:
  /api/busy/snapshot:
    get:
      tags:
        - Busy
      summary: Get BUSY timer snapshot
      description: Gets the current state of the BUSY timer in snapshot form
      operationId: getBusySnapshot
      responses:
        "200":
          description: Got snapshot successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusySnapshot"
        "400":
          description: Error getting snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - Busy
      summary: Set BUSY timer snapshot
      description: Run the timer starting from the given snapshot
      operationId: setBusySnapshot
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusySnapshot"
      responses:
        "200":
          description: Snapshot successfully set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error setting snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/busy/profiles/{slot}:
    get:
      tags:
        - Busy
      summary: Get BUSY timer profile
      description: Gets the BUSY timer profile under specified slot
      operationId: getBusyProfile
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BusyProfileSlot"
      responses:
        "200":
          description: Got profile successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusyProfile"
        "400":
          description: Error getting profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - Busy
      summary: Set BUSY timer profile
      description: Sets the BUSY timer profile under specified slot
      operationId: setBusyProfile
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BusyProfileSlot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusyProfile"
      responses:
        "200":
          description: Profile successfully set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Error setting profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

schemas:
  BusySnapshot:
    type: object
    properties:
      snapshot:
        allOf:
          - oneOf:
              - $ref: "#/components/schemas/BusySnapshotNotStarted"
              - $ref: "#/components/schemas/BusySnapshotInfinite"
              - $ref: "#/components/schemas/BusySnapshotSimple"
              - $ref: "#/components/schemas/BusySnapshotInterval"
          - type: object
            properties:
              busy_bar_settings:
                $ref: "#/components/schemas/BusyBarSettings"
            required:
              - busy_bar_settings
      snapshot_timestamp_ms:
        type: integer
        example: 1761582532251
    required:
      - snapshot
      - snapshot_timestamp_ms

  BusySnapshotNotStarted:
    type: object
    properties:
      type:
        type: string
        const: "NOT_STARTED"
    required:
      - type

  BusySnapshotInfinite:
    type: object
    properties:
      type:
        type: string
        const: "INFINITE"
      card_id:
        type: string
        format: uuid
        example: "00000000-0000-0000-0000-000000000000"
      is_paused:
        type: boolean
        example: false
    required:
      - type
      - card_id
      - is_paused

  BusySnapshotSimple:
    type: object
    properties:
      type:
        type: string
        const: "SIMPLE"
      card_id:
        type: string
        format: uuid
        example: "00000000-0000-0000-0000-000000000000"
      time_left_ms:
        type: integer
        example: 9000
      is_paused:
        type: boolean
        example: false
    required:
      - type
      - card_id
      - time_left_ms
      - is_paused

  BusySnapshotInterval:
    type: object
    properties:
      type:
        type: string
        const: "INTERVAL"
      card_id:
        type: string
        format: uuid
        example: "00000000-0000-0000-0000-000000000000"
      current_interval:
        type: integer
        example: 1
      current_interval_time_total_ms:
        type: integer
        example: 60000
      current_interval_time_left_ms:
        type: integer
        example: 42690
      is_paused:
        type: boolean
        example: false
      interval_settings:
        $ref: "#/components/schemas/BusyTimerIntervalSettings"
    required:
      - type
      - card_id
      - current_interval
      - current_interval_time_total_ms
      - current_interval_time_left_ms
      - is_paused
      - interval_settings

  BusyProfile:
    type: object
    properties:
      sort_order:
        type: integer
        example: -1
      title:
        type: string
        example: "study"
      id:
        type: string
        format: uuid
        example: "00000000-0000-0000-0000-000000000000"
      timer_settings:
        oneOf:
          - $ref: "#/components/schemas/BusyTimerInfiniteSettings"
          - $ref: "#/components/schemas/BusyTimerSimpleSettings"
          - $ref: "#/components/schemas/BusyTimerIntervalSettings"
      busy_bar_settings:
        $ref: "#/components/schemas/BusyBarSettings"
      profile_timestamp_ms:
        type: integer
        example: 1761582532251
    required:
      - sort_order
      - title
      - timer_settings
      - profile_timestamp_ms
      - id
      - busy_bar_settings

  BusyProfileSlot:
    type: string
    enum:
      - "busy"
      - "custom"
    example: "busy"

  BusyTimerInfiniteSettings:
    type: object
    properties:
      type:
        type: string
        const: "INFINITE"
    required:
      - type

  BusyTimerSimpleSettings:
    type: object
    properties:
      type:
        type: string
        const: "SIMPLE"
      total_time_ms:
        type: integer
        example: 300000
    required:
      - type
      - total_time_ms

  BusyTimerIntervalSettings:
    type: object
    properties:
      type:
        type: string
        const: "INTERVAL"
      interval_work_ms:
        type: integer
        example: 120000
      interval_rest_ms:
        type: integer
        example: 60000
      interval_work_cycles_count:
        type: integer
        example: 3
      is_autostart_enabled:
        type: boolean
        example: false
    required:
      - type
      - interval_work_ms
      - interval_rest_ms
      - interval_work_cycles_count
      - is_autostart_enabled

  BusyBarSettings:
    type: object
    properties:
      theme:
        type: string
        example: "on_air"
      show_work_phase_only:
        type: boolean
        example: false
      trigger_smart_home:
        type: boolean
        example: true
      show_work_time:
        type: boolean
        default: true
        example: true
        description: >-
          Show the remaining time during work intervals. When false, the
          time appears only during the final 3-second countdown and
          briefly after a manual time adjustment.
    required:
      - theme
      - show_work_phase_only
      - trigger_smart_home
