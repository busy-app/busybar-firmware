tags:
- name: Apps
  description: JavaScript applications management

paths:
  /api/apps/stage:
    post:
      tags:
        - Apps
      summary: Stage a JavaScript application for installation
      description: Uploads an application package (TGZ or TAR file) and initiates the installation process.
      x-local-only: true
      operationId: stageApp
      parameters: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: JavaScript application TGZ package.
      responses:
        "200":
          description: Application staged successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStageResult"
        "400":
          description: Invalid parameters, invalid package file, or installation preparation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: API version required by the application is not compatible with the firmware.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Application package too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "508":
          description: Failed to save the application package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/install:
    post:
      tags:
        - Apps
      summary: Install a staged JavaScript application
      description: Installs a staged JavaScript application using the installation key
      x-local-only: true
      operationId: installApp
      parameters:
        - name: install_key
          in: query
          required: true
          schema:
            type: integer
          description: Installation key
          example: 123456789
      responses:
        "200":
          description: Application installed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/launch:
    post:
      tags:
        - Apps
      summary: Launch an installed JavaScript application
      description: Launches an installed JavaScript application by its id
      x-local-only: true
      operationId: launchApp
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AppId"
      responses:
        "200":
          description: Application launched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: App with given ID was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Missing or invalid application id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Application conflict. Possible causes:
            - API version required by the application is not compatible with the firmware.
            - A higher-priority application is already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                versionIncompatible:
                  summary: Incompatible API version
                  value:
                    message: "API version required by the application is not compatible with the firmware"
                higherPriorityRunning:
                  summary: Higher-priority app running
                  value:
                    message: "A higher-priority application is already running"
        "503":
          description: Failed to launch the application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/quit:
    post:
      tags:
        - Apps
      summary: Quit from a running JavaScript application
      description: Quits from a running JavaScript application, if there is one
      x-local-only: true
      operationId: quitApp
      responses:
        "200":
          description: Exited from the application successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          description: Application is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Failed to quit from the application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps:
    delete:
      tags:
        - Apps
      summary: Delete a JavaScript application
      description: Removes an installed JavaScript application, keeping its settings
      x-local-only: true
      operationId: removeApp
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AppId"
      responses:
        "200":
          description: Done successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: App with given ID was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Missing application id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: |
            Failed to quit from the application that needs to be uninstalled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/apps/list:
    get:
      tags:
        - Apps
      summary: List installed JavaScript applications
      description: Lists installed JavaScript applications
      x-local-only: true
      operationId: listApps
      responses:
        "200":
          description: Done successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppListResult"

  /api/apps/settings:
    description: |
      Settings document of a JavaScript application.
    get:
      tags:
        - Apps
      summary: Get application settings
      description: >
        Returns the complete settings document; the first request
        materializes it from the schema defaults.
      x-local-only: true
      operationId: getAppSettings
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AppId"
      responses:
        "200":
          description: Settings document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettingsDocument"
        "400":
          description: Invalid app_id parameter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Requested application id does not match running application id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or invalid application, or no settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Invalid settings schema or failed to build the document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "508":
          description: Storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - Apps
      summary: Set application settings
      description: >
        Replaces the settings document: every field must be present and
        valid, with a version matching the application settings; unknown keys
        are dropped.
      x-local-only: true
      operationId: setAppSettings
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsDocument"
      responses:
        "200":
          description: Settings stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid app_id parameter value or invalid document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or invalid application, or no settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Invalid settings schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "508":
          description: Storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - Apps
      summary: Reset application settings
      description: Resets every field to its schema default.
      x-local-only: true
      operationId: resetAppSettings
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AppId"
      responses:
        "200":
          description: Settings reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid app_id parameter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or invalid application, or no settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Invalid settings schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "508":
          description: Storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/apps/queue:
    get:
      tags:
        - Apps
      summary: Get the app queue contents
      description: >
        Get the current status of the app management queue.
      x-local-only: true
      operationId: getAppQueue
      responses:
        "200":
          description: Got status successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppQueueGetResponse"
    post:
      tags:
        - Apps
      summary: Add operation(s) to the app queue
      description: >
        Add specified operations to the app management queue.
      x-local-only: true
      operationId: addToAppQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppQueueAddRequest"
            examples:
              install:
                summary: Install application
                value:
                  operations:
                    - app_id: "com.author.example-app"
                      operation:
                        type: "install"
                        url: "https://author.com/apps/example-app.tgz"
                        version: "1.2.3"
              remove:
                summary: Remove application
                value:
                  operations:
                    - app_id: "com.author.example-app"
                      operation:
                        type: "remove"
      responses:
        "202":
          description: Enqueue results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppQueueAddResponse"
              examples:
                success:
                  summary: Add to queue success
                  value:
                    result:
                      - app_id: "com.author.example-app"
                        operation:
                          type: "install"
                          version: "1.2.3"
                        item_id: 42
                      - app_id: "com.author.example-app"
                        operation:
                          type: "remove"
                          item_id: 67
                failure:
                  summary: Failed to add some elements
                  value:
                    result:
                      - app_id: "com.author.example-app"
                        operation:
                          type: "install"
                          version: "1.2.3"
                        item_id: 42
                      - app_id: "com.author.other-app"
                        operation:
                          type: "install"
                          version: "3.4.5"
                        error: "queue_full"
                      - app_id: "com.author.one-more-app"
                        operation:
                          type: "remove"
                        error: "skipped"
        "400":
          description: Failed to parse request or invalid value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badRequest:
                  summary: Invalid request
                  value:
                    error: "Bad Request"

  /api/apps/queue/cancel:
    post:
      tags:
        - Apps
      summary: Cancel operation or clear the app queue
      description: >
        Cancel a queued operation by its queue ID, or clear the whole queue.
      x-local-only: true
      operationId: cancelAppQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AppQueueCancelRequest"
                - $ref: "#/components/schemas/AppQueueClearRequest"
            examples:
              cancelOne:
                summary: Cancel a single operation
                value:
                  item_id: 42
              clearAll:
                summary: Clear the whole queue
                value:
                  all: true
      responses:
        "202":
          description: >
            Item(s) removed from queue or whole queue cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

schemas:
  AppId:
    type: string
    pattern: "^[a-z0-9_\\-][a-z0-9_\\-.]{0,31}$"
    description: JavaScript application id
    example: "com.author.example-app"

  AppUrl:
    type: string
    format: url
    example: "https://author.com/apps/example-app.tar.gz"

  AppVersion:
    type: string
    description: Version in SemVer (x.y.z) format
    example: "1.2.3"

  AppStageResult:
    type: object
    properties:
      result:
        type: string
        description: "Operation result"
        example: "OK"
      install_key:
        type: integer
        description: "Single-use installation key"
        example: 123456789
      staged:
        $ref: "#/components/schemas/AppInfo"
        description: "Staged application info"
      installed:
        $ref: "#/components/schemas/AppInfo"
        description: "If an application with the same ID is already installed, its info"
    required:
      - result
      - install_key
      - staged
  AppInfo:
    type: object
    properties:
      id:
        type: string
        description: "Application ID"
        example: "com.example.useful-app"
      name:
        type: string
        description: "Human-readable application name"
        example: "A Useful App"
      version:
        type: string
        description: "Application version"
        example: "1.0.0"
      api_version:
        type: string
        description: "Minimum required HTTP API version"
        example: "1.0.0"
      author:
        type: string
        description: "Application author"
        example: "Erika Mustermann"
      description:
        type: string
        description: "Application description"
        example: "An app to assist in my daily routine"
      icon_path:
        type: string
        description: "Application icon path"
        example: "/ext/apps_assets/shared/images/unknown_app_front_8x8.image"
      is_debug:
        type: boolean
        description: "A flag indicating that this app only shows up in debug mode"
        example: false
    required:
      - id
      - name
      - version
      - api_version
      - author
      - description
      - icon_path
      - is_debug
  AppListResult:
    type: object
    properties:
      apps:
        type: array
        items:
          $ref: "#/components/schemas/AppInfo"
    required:
      - apps

  AppSettingsDocument:
    type: object
    properties:
      version:
        type: integer
        description: Settings version of the application schema
        example: 1
      values:
        type: object
        description: Setting values keyed by field id, with groups as nested objects
        additionalProperties: true
        example:
          volume: 5
    required:
      - version
      - values

  AppQueueItemId:
    type: integer
    description: Numeric identifier of the item in the queue
    examples:
      startValue:
        summary: Starting value for the first queue operation after reset
        value: 0
      anyValue:
        summary: Any value during operation (wraps back to 0)
        value: 42

  AppQueueOperationType:
    type: string
    enum:
      - "install"
      - "remove"

  AppQueueOperation:
    type: object
    properties:
      type:
        $ref: "#/components/schemas/AppQueueOperationType"
      version:
        $ref: "#/components/schemas/AppVersion"
    required:
      - type

  AppQueueStatus:
    type: string
    description: Status of the queued operation
    enum:
      - "queued"
      - "in_progress"

  AppQueueError:
    type: string
    description: Error message if item failed to be enqueued
    enum:
      - "timeout"
      - "queue_full"
      - "skipped"

  AppQueueDetail:
    type: object
    description: Additional status of the ongoing operation
    properties:
      step:
        type: string
        example: "unpacking"
      progress:
        type: integer
        minimum: 0
        maximum: 100
        example: 34
    required:
      - step

  AppQueueItem:
    type: object
    description: Single item of the app operation queue
    properties:
      item_id:
        $ref: "#/components/schemas/AppQueueItemId"
      app_id:
        $ref: "#/components/schemas/AppId"
      operation:
        $ref: "#/components/schemas/AppQueueOperation"
      status:
        $ref: "#/components/schemas/AppQueueStatus"
      detail:
        $ref: "#/components/schemas/AppQueueDetail"
    required:
      - item_id
      - app_id
      - operation
      - status

  AppQueueRequestOperation:
    type: object
    properties:
      type:
        $ref: "#/components/schemas/AppQueueOperationType"
      url:
        $ref: "#/components/schemas/AppUrl"
      version:
        $ref: "#/components/schemas/AppVersion"
    required:
      - type

  AppQueueRequestItem:
    type: object
    description: Single item to be sent as an app operation queue command
    properties:
      app_id:
        $ref: "#/components/schemas/AppId"
      operation:
        $ref: "#/components/schemas/AppQueueRequestOperation"
    required:
      - app_id
      - operation

  AppQueueResponseItem:
    type: object
    description: Single item of the app operation queue response
    properties:
      app_id:
        $ref: "#/components/schemas/AppId"
      operation:
        $ref: "#/components/schemas/AppQueueOperation"
      item_id:
        $ref: "#/components/schemas/AppQueueItemId"
      error:
        $ref: "#/components/schemas/AppQueueError"
    oneOf:
    - required:
      - app_id
      - operation
      - item_id
    - required:
      - app_id
      - operation
      - error

  AppQueueGetResponse:
    type: object
    properties:
      result:
        type: array
        items:
          $ref: "#/components/schemas/AppQueueItem"
    required:
      - result

  AppQueueAddRequest:
    type: object
    properties:
      operations:
        type: array
        items:
          $ref: "#/components/schemas/AppQueueRequestItem"
    required:
      - operations

  AppQueueAddResponse:
    type: object
    properties:
      result:
        type: array
        items:
          $ref: "#/components/schemas/AppQueueResponseItem"
    required:
      - result

  AppQueueCancelRequest:
    type: object
    properties:
      item_id:
        $ref: "#/components/schemas/AppQueueItemId"
    required:
      - item_id

  AppQueueClearRequest:
    type: object
    properties:
      all:
        type: boolean
        const: true
    required:
      - all
