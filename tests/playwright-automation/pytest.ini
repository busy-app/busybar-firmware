[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    ui: User interface tests for cross-browser validation
    smoke: Quick smoke tests for CI/CD
    regression: Full regression test suite
    critical: Critical functionality tests
    wifi: WiFi configuration tests
    bluetooth: Bluetooth functionality tests
    firmware: Firmware update tests
    slow: Tests that take more than 30 seconds
    flaky: Tests that might be flaky and need retry

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Reporting
addopts =
    --verbose
    --strict-markers
    --tb=short
    --capture=no
    --color=yes
    --maxfail=5
    --reruns=2
    --reruns-delay=5

# Timeout
timeout = 300
timeout_method = thread

# Parallel execution (uncomment for CI)
# addopts = -n auto