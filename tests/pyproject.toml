[tool.poetry]
name = "bsb-automation-tests"
version = "0.1.0"
description = "Automated test suite for BSB CLI and Web Frontend"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
pytest = ">=8.0,<9.0"
pytest-xdist = "^3.3.1"
allure-pytest = "^2.13.2"
requests = "^2.31.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
structlog = "^23.1.0"
colorlog = "^6.7.0"
pytest-asyncio = ">=0.20,<0.24"
pytest-rerunfailures = "^16.0.1"
pytest-timeout = "^2.2"
beautifulsoup4 = "^4.13.5"
schemathesis = ">=4.0"
Pillow = ">=10.0"
protobuf = ">=5.0"
grpcio-tools = "^1.80.0"
paho-mqtt = ">=2.0"
PyYAML = "^6.0"
websocket-client = "^1.9.0"
zeroconf = "^0.150.0"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
flake8 = "^6.0.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --alluredir=allure-results --clean-alluredir"
timeout = 120
timeout_method = "thread"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "cli: marks tests as CLI command tests",
    "frontend: marks tests as web frontend tests",
    "ui: marks tests as UI automation tests (Playwright)",
    "ui_validation: marks tests as UI validation",
    "interface_status: marks tests as interface status tests",
    "commands_check: marks tests as command validation",
    "mqtt: marks tests as MQTT functionality",
    "uses_cloud: marks tests that require real cloud test account/session service",
    "external_service: marks tests that talk to services outside the device",
    "state_publisher: marks state publisher transport/protobuf tests",
    "uses_ble: marks tests that require BLE adapter/hardware path",
    "matter: marks tests that require a Matter controller (Home Assistant)",
    "mdns: marks tests that validate multicast DNS discovery",
    "rate_limiter: marks state publisher rate limiter tests",
    "long_running: marks long-running hardware regression tests",
    "regression: marks heavy regression tests",
    "uses_si917: marks tests that exercise the Si917 coprocessor",
    "asyncio: marks tests as async tests",
    "story_commands_check: marks tests for commands check story",
    "story_ui_validation: marks tests for UI validation story",
    "schemathesis: marks tests as OpenAPI schema conformance tests (schemathesis)",
]

[tool.allure.pytest_plugin]
clean_alluredir = true
