demo:
  #############################################################################
  # NCP Applications
  #############################################################################
  # ---------------------------------------------------------------------------
  # Serial API Controller
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_ncp_serial_api/zwave_ncp_serial_api_controller.slcp
    signing_key: *demo_controller_sign_key
    encryption_key: *demo_controller_encrypt_key
    bootloader: *demo_otw_bootloader
    variant:
      - <<: *demo_default_variant
        name: SerialAPIController_Default
        description: *demo_sapi_description
      - <<: *demo_v255_variant
        name: SerialAPIController_v255
        description: *demo_sapi_v255_description
  # ---------------------------------------------------------------------------
  # Serial API End Device
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_ncp_serial_api/zwave_ncp_serial_api_end_device.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_otw_bootloader
    variant:
      - <<: *demo_default_variant
        name: SerialAPIEndDevice_Default
        description: *demo_sapi_description
      - <<: *demo_v255_variant
        name: SerialAPIEndDevice_v255
        description: *demo_sapi_v255_description
  # ---------------------------------------------------------------------------
  # Zniffer
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_ncp_zniffer/zwave_ncp_zniffer.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_otw_bootloader
    variant:
      # INFO: v255 version is not required because the Zniffer is developer tool, no need to OTW update
      - <<: *demo_default_variant
        name: Zniffer_Default
        description: "IMPORTANT: By the NCP Zniffer Application, the region is selected by the Host application."
  #############################################################################
  # SOC Applications
  #############################################################################
  # ---------------------------------------------------------------------------
  # Door Lock Keypad
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_soc_door_lock_keypad/zwave_soc_door_lock_keypad.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_ota_bootloader
    variant:
      - <<: *demo_default_variant
        name: DoorLockKeypad_Default
      - <<: *demo_v255_variant
        name: DoorLockKeypad_v255
  # ---------------------------------------------------------------------------
  # LED Bulb
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_soc_led_bulb/zwave_soc_led_bulb.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_ota_bootloader
    variant:
      - <<: *demo_default_variant
        name: LedBulb_Default
      - <<: *demo_v255_variant
        name: LedBulb_v255
  # ---------------------------------------------------------------------------
  # Multilevel Sensor
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_soc_multilevel_sensor/zwave_soc_multilevel_sensor.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_ota_bootloader
    variant:
      - <<: *demo_default_variant
        name: MultilevelSensor_Default
      - <<: *demo_v255_variant
        name: MultilevelSensor_v255
  # ---------------------------------------------------------------------------
  # Power Strip
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_soc_power_strip/zwave_soc_power_strip.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_ota_bootloader
    variant:
      - <<: *demo_default_variant
        name: PowerStrip_Default
      - <<: *demo_v255_variant
        name: PowerStrip_v255
  # ---------------------------------------------------------------------------
  # Sensor PIR
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_soc_sensor_pir/zwave_soc_sensor_pir.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_ota_bootloader
    variant:
      - <<: *demo_default_variant
        name: SensorPIR_Default
      - <<: *demo_v255_variant
        name: SensorPIR_v255
  # ---------------------------------------------------------------------------
  # Switch On/Off
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_soc_switch_on_off/zwave_soc_switch_on_off.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_ota_bootloader
    variant:
      - <<: *demo_default_variant
        name: SwitchOnOff_Default
      - <<: *demo_v255_variant
        name: SwitchOnOff_v255
  # ---------------------------------------------------------------------------
  # Wall Controller
  # ---------------------------------------------------------------------------
  - path: sample_apps/zwave_soc_wall_controller/zwave_soc_wall_controller.slcp
    signing_key: *demo_sample_sign_key
    encryption_key: *demo_sample_encrypt_key
    bootloader: *demo_ota_bootloader
    variant:
      - <<: *demo_default_variant
        name: WallController_Default
      - <<: *demo_v255_variant
        name: WallController_v255
