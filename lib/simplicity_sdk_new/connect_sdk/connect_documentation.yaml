###########################################
#  Flex documentation packaging definition
#  
#  Yaml Element description:
#  - Title, ordered by the number at the start of the string. The number is 
#    stripped when presenting the doc in release metadata. Lower numbers are 
#    ordered first
#  - source-location: where the doc comes from. Docs in the docs_v2 repo are
#    referenced with ${DOCS_V2}
#  - installer-destination: where in the installer the doc belongs
#  - index-classification: what group in the doc index.html file the doc 
#    belongs to-rail-version
#  - doc-number: the doc tracking number 
#  - studio-metadata-group: the group of docs the doc belongs to in studio 
#    presentation
#  - studio-priority: how highly studio should recommend viewing the doc
#  - sdkAndProtocolTags: For documents appearing in multiple SDKs, the list of technologies
#  - document-description: text describing the context for the doc, used 
#    to preview the doc in both index.html and the studio metadata 
###########################################

