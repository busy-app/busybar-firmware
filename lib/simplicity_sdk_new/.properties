# Ensure protocols dont break board compatibility
prop.boardCompatibility=.*

# ESF
prop.requiredFeatureLevel=esf:2;app_framework:143
# ---- Location of apack.info ----
prop.file.adapterPacks=bluetooth_bgbuild bluetooth_mesh_middleware/script/generator radio_config_generator wisun_config_generator zwave_cc_configurator
prop.supportModules=true
prop.useAdditionalLibraries=true

prop.file.hwconfFile=pintool/platform/hwconf_data/hwconfig.hwdata

# (V)SE files
prop.file.seFirmwareFolders=se_firmware_xg28 se_firmware_x301 se_firmware_xg21 se_firmware_xg27 se_firmware_xg25 se_firmware_xg26 se_firmware_xg24 se_firmware_xg22 se_firmware_xg23 se_firmware_xg29
