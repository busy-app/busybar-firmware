name: Get commit details
description: >-
  Resolve the event type, build profile and CI naming outputs (branch name,
  build suffix, commit SHA) used across the build workflows. Also exports the
  BRANCH_NAME / COMMIT_SHA / SUFFIX job environment variables via get_env.py.
author: hedger

outputs:
  build_profile:
    description: Build profile ('debug' or 'release')
    value: ${{ steps.names.outputs.build_profile }}
  branch_name:
    description: Sanitized branch name used in artifact URLs
    value: ${{ steps.names.outputs.branch_name }}
  suffix:
    description: Build suffix used in artifact names
    value: ${{ steps.names.outputs.suffix }}
  commit_sha:
    description: Short commit SHA
    value: ${{ steps.names.outputs.commit_sha }}

runs:
  using: composite
  steps:
    - name: 'Get commit details'
      id: names
      shell: bash
      run: |
        set -euo pipefail
        PROFILE='debug'
        if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
          TYPE="pull"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TYPE="tag"
          PROFILE='release'
        else
          TYPE="other"
        fi
        echo "event_type=$TYPE" >> "$GITHUB_OUTPUT"
        echo "build_profile=$PROFILE" >> "$GITHUB_OUTPUT"
        python3 fbt_layers/fbtng/scripts/get_env.py "--event_file=${{ github.event_path }}" "--type=$TYPE" || (cat "${{ github.event_path }}" && exit 1)
