name: Build firmware artifacts
author: hedger
description: Build firmware artifacts for distribution

inputs:
  target_spec:
    description: Target specification in the format "U5TARGET_SILTARGET", e.g. "21_64"
    required: true
    default: "21_64"
  build_type:
    description: "Build profile to use (release/debug)."
    required: false
    default: "release"
  build_flags:
    description: Override build flags passed to fbt (e.g. "DEBUG=1 COMPACT=0")
    required: false
    default: ""
  artifact_path:
    description: Path to store the built artifacts
    required: false
    default: "artifacts"
  firmware_app_set:
    description: Optional FIRMWARE_APP_SET argument
    required: false
    default: ""
  extra_fbt_args:
    description: Additional arguments to append to the fbt command
    required: false
    default: ""
  custom_suffix:
    description: Optional suffix override for artifact naming
    required: false
    default: ""
  configure_lfs:
    description: Configure Git LFS and credentials before building
    required: false
    default: "true"
  generate_hashes:
    description: Generate sha256 sums for produced artifacts
    required: false
    default: "true"
  signing_service_url:
    description: Signing service API endpoint URL for Silabs RPS files. Leave empty to skip signing.
    required: false
    default: ""
  signing_service_token:
    description: Bearer token for the signing service.
    required: false
    default: ""
  signing_service_profile:
    description: Signing service profile name.
    required: false
    default: ""

outputs:
  artifact_path:
    description: Directory containing copied artifacts
    value: ${{ steps.vars.outputs.artifact_path }}
  u5_target_hw:
    description: Parsed U5 target value
    value: ${{ steps.vars.outputs.u5_target_hw }}
  sil_target_hw:
    description: Parsed Silabs target value
    value: ${{ steps.vars.outputs.sil_target_hw }}

runs:
  using: "composite"
  steps:
    - id: vars
      shell: bash
      run: |
        set -euo pipefail
        TARGET_SPEC="${{ inputs.target_spec }}"
        if [[ -z "$TARGET_SPEC" ]]; then
          echo "target_spec input is required" >&2
          exit 1
        fi
        if [[ "$TARGET_SPEC" != *"_"* ]]; then
          echo "target_spec must contain an underscore (U5_SIL), got '$TARGET_SPEC'" >&2
          exit 1
        fi
        RAW_U5="${TARGET_SPEC%%_*}"
        RAW_SIL="${TARGET_SPEC#*_}"
        U5_TARGET="${RAW_U5#f}"
        SIL_TARGET="${RAW_SIL#f}"
        if [[ -z "$U5_TARGET" || -z "$SIL_TARGET" ]]; then
          echo "Failed to parse target_spec='$TARGET_SPEC'" >&2
          exit 1
        fi

        if [[ -n "${{ inputs.build_flags }}" ]]; then
          BUILD_FLAGS="${{ inputs.build_flags }}"
        else
          case "${{ inputs.build_type }}" in
            release)
              BUILD_FLAGS='DEBUG=0 COMPACT=1'
              ;;
            debug)
              BUILD_FLAGS='DEBUG=1 COMPACT=0'
              ;;
            *)
              echo "Unsupported build_type '${{ inputs.build_type }}'. Use 'release' or 'debug'." >&2
              exit 1
              ;;
          esac
        fi

        EXTRA_ARGS="${{ inputs.extra_fbt_args }}"
        if [[ -n "${{ inputs.firmware_app_set }}" ]]; then
          if [[ -n "$EXTRA_ARGS" ]]; then
            EXTRA_ARGS+=" "
          fi
          EXTRA_ARGS+="FIRMWARE_APP_SET=${{ inputs.firmware_app_set }}"
        fi

        echo "U5_TARGET_HW=$U5_TARGET" >> "$GITHUB_ENV"
        echo "SIL_TARGET_HW=$SIL_TARGET" >> "$GITHUB_ENV"
        echo "FBT_BUILD_FLAGS=$BUILD_FLAGS" >> "$GITHUB_ENV"
        echo "FBT_EXTRA_ARGS=$EXTRA_ARGS" >> "$GITHUB_ENV"
        echo "ARTIFACT_PATH=${{ inputs.artifact_path }}" >> "$GITHUB_ENV"
        echo "artifact_path=${{ inputs.artifact_path }}" >> "$GITHUB_OUTPUT"
        echo "u5_target_hw=$U5_TARGET" >> "$GITHUB_OUTPUT"
        echo "sil_target_hw=$SIL_TARGET" >> "$GITHUB_OUTPUT"
        if [[ -n "${{ inputs.custom_suffix }}" ]]; then
          echo "DIST_SUFFIX=${{ inputs.custom_suffix }}" >> "$GITHUB_ENV"
        fi

    - name: Configure Git and LFS
      if: inputs.configure_lfs == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git lfs install --skip-smudge
        if [[ -n "${GH_TOKEN:-}" ]]; then
          # Self-hosted runners persist $HOME; keep creds in per-job RUNNER_TEMP.
          rm -f "$HOME/.git-credentials"
          echo "https://x-access-token:${GH_TOKEN}@github.com" > "${RUNNER_TEMP}/git-credentials"
          git config credential.helper "store --file ${RUNNER_TEMP}/git-credentials"
        fi
        git config lfs.transfer.maxretries 3
        # Fail fast on stalled connections: 30s with no data = abort
        git config --global http.lowSpeedLimit 100
        git config --global http.lowSpeedTime 30

    - name: Update submodules
      uses: ./.github/actions/update-submodules
      with:
        paths: scripts/toolchain fbt_layers/fbtng
        recursive: 'true'

    - name: Build update package
      shell: bash
      run: |
        set -euo pipefail
        source ./scripts/toolchain/fbtenv.sh
        export FBT_GIT_SUBMODULE_SHALLOW=1
        ARGS=("U5_TARGET_HW=${U5_TARGET_HW}" "SIL_TARGET_HW=${SIL_TARGET_HW}")
        if [[ -n "${FBT_BUILD_FLAGS}" ]]; then
          # shellcheck disable=SC2206
          ARGS+=( ${FBT_BUILD_FLAGS} )
        fi
        if [[ -n "${FBT_EXTRA_ARGS}" ]]; then
          # shellcheck disable=SC2206
          ARGS+=( ${FBT_EXTRA_ARGS} )
        fi
        TARGETS=(dist)
        SIGN_URL="${{ inputs.signing_service_url }}"
        SIGN_TOKEN="${{ inputs.signing_service_token }}"
        SIGN_PROFILE="${{ inputs.signing_service_profile }}"
        if [[ -n "$SIGN_URL" && -n "$SIGN_TOKEN" && -n "$SIGN_PROFILE" ]]; then
          ARGS+=("SI917_SIGN_SERVICE_URL=${SIGN_URL}")
          ARGS+=("SI917_SIGN_SERVICE_TOKEN=${SIGN_TOKEN}")
          ARGS+=("SI917_SIGN_SERVICE_PROFILE=${SIGN_PROFILE}")
          TARGETS+=(dist_signed)
        fi
        bash ./fbt "${ARGS[@]}" "${TARGETS[@]}"

    - name: Build recovery DFU
      shell: bash
      run: |
        set -euo pipefail
        source ./scripts/toolchain/fbtenv.sh
        export FBT_GIT_SUBMODULE_SHALLOW=1
        ARGS=("TARGET_HW=${U5_TARGET_HW}" "FIRMWARE_APP_SET=recovery")
        if [[ -n "${FBT_BUILD_FLAGS}" ]]; then
          # shellcheck disable=SC2206
          ARGS+=( ${FBT_BUILD_FLAGS} )
        fi
        bash ./fbt "${ARGS[@]}" firmware_dfu

    - name: Check for uncommitted changes
      shell: bash
      run: |
        set -euo pipefail
        git diff --exit-code

    - name: Copy build artifacts
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$ARTIFACT_PATH"
        mkdir -p "$ARTIFACT_PATH"
        cp -v dist/f${U5_TARGET_HW}-*/* "$ARTIFACT_PATH"/
        cp -v fbt_layers/fbtng/build/f${U5_TARGET_HW}-firmware-*/fw_artifacts/firmware.dfu "$ARTIFACT_PATH"/busybar-f${U5_TARGET_HW}-recovery-${DIST_SUFFIX:-${SUFFIX:-local}}.dfu

    - name: Calculate hashsums for artifacts
      if: inputs.generate_hashes == 'true'
      shell: bash
      working-directory: ${{ inputs.artifact_path }}
      run: |
        set -euo pipefail
        SUMS_FILE="busybar-f${U5_TARGET_HW}-sha256sum.txt"
        find . -maxdepth 1 -type f ! -name "$SUMS_FILE" -printf '%f\0' \
          | LC_ALL=C sort -z \
          | xargs -0 sha256sum \
          > "$SUMS_FILE"
