name: 'Unit test build'

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

env:
  FBT_GIT_SUBMODULE_SHALLOW: 0
  DEFAULT_TARGET_SPEC: 21_64
  FBT_TOOLCHAIN_PATH: /runner/_work

jobs:
  unit-test-build:
    runs-on: BsbShell
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        target_spec: ["21_64"]

    steps:
      - name: 'Wipe workspace'
        run: |
          find ./ -mount -maxdepth 1 -exec rm -rf {} \;

      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build firmware artifacts'
        id: build-fw
        uses: ./.github/actions/artifacts-dist.yml
        with:
          target_spec: ${{ matrix.target_spec }}
          build_type: debug
          firmware_app_set: unit_tests
          artifact_path: unit-test-artifacts

      - name: 'Bundle artifacts into zip'
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${{ steps.build-fw.outputs.artifact_path }}"
          zip_name="unit-tests-f${U5_TARGET_HW}.zip"
          rm -f "$zip_name"
          (cd "$ARTIFACT_DIR" && zip -qr "../$zip_name" .)
          echo "zip_path=$zip_name" >> "$GITHUB_OUTPUT"

    #   - name: 'Upload bundled artifacts'
    #     uses: actions/upload-artifact@v4
    #     with:
    #       name: unit-tests-f${{ steps.build-fw.outputs.u5_target_hw }}
    #       path: ${{ steps.zip.outputs.zip_path }}
    #       if-no-files-found: error
