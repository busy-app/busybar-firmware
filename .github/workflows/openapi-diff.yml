name: "OAS diff check"

on:
    pull_request:
        types: [opened, synchronize]
        paths:
            - "applications/services/web_server/resources/apps_assets/web_server/www/openapi.yaml"
    push:
        branches:
            - dev
        paths:
            - "applications/services/web_server/resources/apps_assets/web_server/www/openapi.yaml"

jobs:
    oasdiff:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout current
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 2

            - name: Checkout base
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
                  path: base

            - name: Install oasdiff
              run: |
                  curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

            - name: Run oasdiff
              id: oasdiff
              env:
                  OAS_PATH: applications/services/web_server/resources/apps_assets/web_server/www/openapi.yaml
              run: |
                  set -o pipefail

                  SUMMARY="$(oasdiff summary "base/$OAS_PATH" "$OAS_PATH" 2>&1)" || true
                  echo 'summary<<EOF' >> "$GITHUB_OUTPUT"
                  echo "$SUMMARY" >> "$GITHUB_OUTPUT"
                  echo 'EOF' >> "$GITHUB_OUTPUT"

                  if oasdiff breaking -o ERR --format markdown "base/$OAS_PATH" "$OAS_PATH" > breaking.md 2>&1; then
                    echo "exit_code=0" >> "$GITHUB_OUTPUT"
                  else
                    echo "exit_code=$?" >> "$GITHUB_OUTPUT"
                  fi

                  CHANGELOG="$(oasdiff changelog --format markdown "base/$OAS_PATH" "$OAS_PATH" 2>&1)" || true
                  echo 'changelog<<EOF' >> "$GITHUB_OUTPUT"
                  echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
                  echo 'EOF' >> "$GITHUB_OUTPUT"

                  echo 'breaking<<EOF' >> "$GITHUB_OUTPUT"
                  cat breaking.md >> "$GITHUB_OUTPUT"
                  echo 'EOF' >> "$GITHUB_OUTPUT"

                  REPORT_MD="$(oasdiff diff --format markdown "base/$OAS_PATH" "$OAS_PATH" 2>&1)" || true
                  echo 'report_md<<EOF' >> "$GITHUB_OUTPUT"
                  echo "$REPORT_MD" >> "$GITHUB_OUTPUT"
                  echo 'EOF' >> "$GITHUB_OUTPUT"

            - name: Comment on PR
              if: ${{ github.event_name == 'pull_request' }}
              uses: thollander/actions-comment-pull-request@v3
              with:
                  message: |
                      **OpenAPI diff:** ${{ steps.oasdiff.outputs.exit_code == '0' && '✅ No breaking changes' || '❌ Breaking changes detected' }}

                      **Summary**
                      ```
                      ${{ steps.oasdiff.outputs.summary }}
                      ```

                      <details>
                      <summary>Changelog</summary>

                      ${{ steps.oasdiff.outputs.changelog }}

                      </details>

                      <details>
                      <summary>Breaking changes report</summary>

                      ${{ steps.oasdiff.outputs.breaking }}

                      </details>

                      <details>
                      <summary>Full diff</summary>

                      ${{ steps.oasdiff.outputs.report_md }}

                      </details>
                  comment-tag: oasdiff-report

            - name: Post to Slack
              if: always()
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.OPENAPI_DIFF_SLACK_WEBHOOK_URL }}
              run: |
                  if [ -z "$SLACK_WEBHOOK_URL" ]; then
                    echo "::warning::OPENAPI_DIFF_SLACK_WEBHOOK_URL secret is not set, skipping Slack notification"
                    exit 0
                  fi

                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    EVENT_TITLE="${{ github.event.pull_request.title }}"
                    EVENT_URL="${{ github.event.pull_request.html_url }}"
                    EVENT_AUTHOR="${{ github.event.pull_request.user.login }}"
                  else
                    EVENT_TITLE="Merged to ${{ github.ref_name }}: $(git log -1 --pretty=%s)"
                    EVENT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                    EVENT_AUTHOR="${{ github.actor }}"
                  fi
                  STATUS=${{ steps.oasdiff.outputs.exit_code == '0' && '"✅ No breaking changes"' || '"❌ Breaking changes detected"' }}

                  SUMMARY=$(echo '${{ steps.oasdiff.outputs.summary }}' | head -30)
                  REPORT=$(echo '${{ steps.oasdiff.outputs.report_md }}' | head -80)

                  curl -fsSL -X POST "$SLACK_WEBHOOK_URL" \
                    -H 'Content-Type: application/json' \
                    -d "$(jq -n \
                      --arg status "$STATUS" \
                      --arg summary "$SUMMARY" \
                      --arg report "$REPORT" \
                      --arg pr_title "$EVENT_TITLE" \
                      --arg pr_url "$EVENT_URL" \
                      --arg pr_author "$EVENT_AUTHOR" \
                      '{
                        blocks: [
                          {
                            type: "header",
                            text: { type: "plain_text", text: ("OpenAPI Spec Changed — " + $status) }
                          },
                          {
                            type: "section",
                            text: { type: "mrkdwn", text: ("*<" + $pr_url + "|" + $pr_title + ">* by " + $pr_author) }
                          },
                          {
                            type: "section",
                            text: { type: "mrkdwn", text: ("```" + $summary + "```") }
                          },
                          {
                            type: "section",
                            text: { type: "mrkdwn", text: ("```" + $report + "```") }
                          }
                        ]
                      }'
                    )"

        #   - name: Fail if breaking changes
        #     if: ${{ steps.oasdiff.outputs.exit_code != '0' }}
        #     run: |
        #       echo "::error::Breaking changes detected in OpenAPI spec"
        #       exit 1
