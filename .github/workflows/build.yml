name: 'Build'

on:
  push:
    branches:
      - dev
    tags:
      - '*'
  pull_request:

env:
  FBT_GIT_SUBMODULE_SHALLOW: 0

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc)

      - name: 'Get commit details'
        id: names
        run: |
          BUILD_TYPE='DEBUG=1 COMPACT=0'
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            TYPE="pull"
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TYPE="tag"
            BUILD_TYPE='DEBUG=0 COMPACT=1'
          else
            TYPE="other"
          fi
          # python3 fbt_layers/fbtng/scripts/get_env.py "--event_file=${{ github.event_path }}" "--type=$TYPE" || cat "${{ github.event_path }}"
          # echo "event_type=$TYPE" >> $GITHUB_OUTPUT
          # echo "FBT_BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV

      - name: 'Build the firmware and apps'
        id: build-fw
        run: |
          source ./scripts/toolchain/fbtenv.sh
          echo Debug: PATH=$PATH
          echo Toolchain: `which arm-none-eabi-gcc` `arm-none-eabi-gcc --version`
          echo Toolchain: `ls -al toolchain/latest`
          bash ./fbt TARGET_HW=20 $FBT_BUILD_TYPE
          bash ./fbt TARGET_HW=64 $FBT_BUILD_TYPE

      - name: 'Check for uncommitted changes'
        run: |
          git diff --exit-code
