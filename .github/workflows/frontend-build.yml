name: Build frontend, check output bundle diff
on:
  push:
    branches:
      - dev
    tags:
      - "*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20]
    defaults:
      run:
        shell: bash
        working-directory: ./assets/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
       
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: assets/frontend/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build/ci

      - name: Check output bundle diff
        run: git diff --exit-code || (echo "Output bundle has changed. Please review the changes." && exit 1)