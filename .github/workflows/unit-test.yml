name: 'Unit tests'

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      update_url:
        required: true
        type: string
      target:
        required: false
        type: string
        default: '21'

permissions:
  contents: read
  checks: write
  id-token: write

env:
  U5_HW_TARGET: ${{ inputs.target }}
  FBT_GIT_SUBMODULE_SHALLOW: 0
  FBT_TOOLCHAIN_PATH: /runner/_work

jobs:
  unit-tests:
    runs-on: BusyBarTest
    steps:
      - name: 'Checkout code at the build’s commit'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 2

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) scripts/toolchain fbt_layers/fbtng

      - name: 'Download unit test package'
        run: |
          set -euo pipefail
          URL="https://update.flipperzero.one/builds/busybar-firmware/${{ inputs.update_url }}"
          echo "Using URL: $URL"
          curl --fail -L -o busybar-f${{ inputs.target }}-unittests.zip "$URL"
          unzip -q busybar-f${{ inputs.target }}-unittests.zip -d unittests

      - name: 'Flash firmware'
        id: flashing
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py format --no-confirm
          python3 scripts/testops.py update-fw unittests/busybar-f${{ inputs.target }}-update-unittests.tar
          python3 scripts/testops.py wait -t 280

      - name: 'Check that both cores are available (post-flash)'
        if: steps.flashing.outcome == 'success'
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py sanity

      - name: 'Run units'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py unit-tests

      - name: 'Configure AWS CLI'
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: 'Upload runner logs to S3'
        if: always()
        run: |
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"
          LOG_FILE="/opt/logs/${{ runner.name }}/latest/runlog.log"
          S3_PATH="s3://flipper-aws-qa-tests/bsb/runner-logs/unit-tests/$RUN_ID/runlog.log"
          PUBLIC_URL="https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/runner-logs/unit-tests/$RUN_ID/runlog.log"

          if [ -f "$LOG_FILE" ]; then
            aws s3 cp "$LOG_FILE" "$S3_PATH"
            echo "## 📋 Runner Logs" >> $GITHUB_STEP_SUMMARY
            echo "- [runlog.log]($PUBLIC_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Log file not found: $LOG_FILE"
          fi
