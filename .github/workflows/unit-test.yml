name: 'Unit and Smoke Tests'

on:
  push:
    branches:
      - dev
    tags:
      - '*'
  pull_request:

permissions:
  contents: read
  checks: write

env:
  FBT_GIT_SUBMODULE_SHALLOW: 0
  DEFAULT_TARGET: 21
  FBT_TOOLCHAIN_PATH: /runner/_work

jobs:
  unit_and_smoke_tests:
    name: 'Unit + Smoke Tests'
    runs-on: BusyBarTest

    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Configure Git and LFS for submodules'
        run: |
          # Configure Git LFS
          git lfs install --skip-smudge

          # Set up authentication for GitHub repositories at repo level
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
          git config credential.helper 'store --file ~/.git-credentials'

          # Configure LFS settings
          git config lfs.transfer.maxretries 3

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) scripts/toolchain fbt_layers/fbtng || (git lfs logs last && exit 1)

      - name: 'Build unit test firmware'
        run: |
          set -euo pipefail
          source ./scripts/toolchain/fbtenv.sh
          export FBT_GIT_SUBMODULE_SHALLOW=1
          bash ./fbt FIRMWARE_APP_SET=unit_tests

      - name: 'Flash unit tests firmware'
        if: success()
        id: flashing
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py format --no-confirm
          mkdir -p update_bundle
          tar -xf dist/f${{ env.DEFAULT_TARGET }}-D/busybar-f${{ env.DEFAULT_TARGET }}-update-local.tar -C update_bundle
          python3 scripts/storage.py -p 10.0.4.20 send update_bundle /ext/tmp/upd_bundle
          python3 scripts/testops.py update-bundle /ext/tmp/upd_bundle/update.json
          python3 scripts/testops.py wait -t 240

      - name: 'Check that both cores are available (post-flash)'
        if: steps.flashing.outcome == 'success'
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py sanity

      - name: 'Run unit tests'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py unit-tests

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Load cached venv
        id: cached-pip-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-3.11-${{ hashFiles('**/requirements.txt') }}

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run smoke tests
        run: |
          cd scripts/testing
          python3 -m pytest . -v \
            --alluredir=allure-results \
            --clean-alluredir \
            --tb=short \
            --junitxml=test-results.xml
        continue-on-error: true
        env:
          CLI_HOST: ${{ secrets.CLI_HOST || '10.0.4.20' }}
          CLI_PORT: ${{ secrets.CLI_PORT || '23' }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'http://10.0.4.20' }}
          LOG_LEVEL: INFO
          LOG_TO_FILE: true

      - name: Setup allurectl
        if: always()
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ secrets.ALLURE_TESTOPS_URL }}
          allure-token: ${{ secrets.ALLURE_TESTOPS_TOKEN }}
          allure-project-id: ${{ secrets.ALLURE_PROJECT_ID }}

      - name: Upload test results to Allure TestOps
        if: always()
        run: |
          cd scripts/testing
          echo "Attempting upload with command:"
          echo "allurectl upload allure-results --endpoint https://flipper.testops.cloud --token ${{ secrets.ALLURE_TESTOPS_TOKEN }} --project-id 232 --launch-name 'GitHub Actions - ${{ github.workflow }} - ${{ github.sha }}'"

          # Try the upload
          allurectl upload allure-results \
            --endpoint "${{ secrets.ALLURE_TESTOPS_URL }}" \
            --token "${{ secrets.ALLURE_TESTOPS_TOKEN }}" \
            --project-id "${{ secrets.ALLURE_PROJECT_ID }}" \
            --launch-name "GitHub Actions - ${{ github.workflow }} - ${{ github.sha }}"

          # Check the exit code
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "Upload successful!"
            echo "View results: ${{ secrets.ALLURE_TESTOPS_URL }}/project/${{ secrets.ALLURE_PROJECT_ID }}"
          else
            echo "Upload failed with exit code: $exit_code"
            exit $exit_code
          fi

      - name: Configure AWS CLI
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Upload test results to S3
        if: always()
        run: |
          cd scripts/testing
          # Create unique path for this test run with project prefix
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"
          S3_PATH="s3://flipper-aws-qa-tests/bsb/test-results/all/$RUN_ID"

          # Upload test results
          aws s3 sync allure-results/ "$S3_PATH/allure-results/" --delete
          aws s3 cp test-results.xml "$S3_PATH/test-results.xml"

          # Upload logs if they exist
          if [ -d "logs" ]; then
            aws s3 sync logs/ "$S3_PATH/logs/" --delete
          fi

          echo "Test results uploaded to: $S3_PATH"
        continue-on-error: true


      - name: Set up Java (required for Allure report generation)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -zxf allure-2.32.0.tgz
          sudo mv allure-2.32.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Download previous Allure history from S3
        if: always()
        run: |
          cd scripts/testing
          # Download previous history if it exists
          HISTORY_PATH="s3://flipper-aws-qa-tests/bsb/allure-history/all"
          mkdir -p allure-history

          # Try to download existing history (ignore errors if it doesn't exist)
          aws s3 sync "$HISTORY_PATH/" allure-history/ || echo "No previous history found, starting fresh"
        continue-on-error: true

      - name: Generate Allure report with history
        if: always()
        run: |
          cd scripts/testing
          # Copy history to allure-results if it exists
          if [ -d "allure-history" ] && [ "$(ls -A allure-history)" ]; then
            cp -r allure-history/* allure-results/ 2>/dev/null || true
          fi

          # Generate report
          allure generate allure-results --clean -o allure-report

          # Extract history for next run
          mkdir -p allure-history-new
          if [ -d "allure-report/history" ]; then
            cp -r allure-report/history/* allure-history-new/ 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Upload Allure report and history to S3
        if: always()
        run: |
          cd scripts/testing
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"

          # Upload the complete report
          REPORT_PATH="s3://flipper-aws-qa-tests/bsb/allure-reports/all/$RUN_ID"
          PUBLIC_URL="https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/$RUN_ID/index.html"
          aws s3 sync allure-report/ "$REPORT_PATH/" --delete

          # Upload latest report as "latest" for easy access
          LATEST_PATH="s3://flipper-aws-qa-tests/bsb/allure-reports/all/latest"
          LATEST_PUBLIC_URL="https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/latest/index.html"
          aws s3 sync allure-report/ "$LATEST_PATH/" --delete

          # Upload history for next run
          if [ -d "allure-history-new" ] && [ "$(ls -A allure-history-new)" ]; then
            HISTORY_PATH="s3://flipper-aws-qa-tests/bsb/allure-history/all"
            aws s3 sync allure-history-new/ "$HISTORY_PATH/" --delete
          fi

          echo "Allure report uploaded to: $REPORT_PATH"
          echo "Latest report available at: $LATEST_PATH"

          # Add links to GitHub step summary
          echo "## Allure Reports (all)" >> $GITHUB_STEP_SUMMARY
          echo "- [This Run ($RUN_ID)]($PUBLIC_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- [Latest Report]($LATEST_PUBLIC_URL)" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Create Job Summary
        if: always()
        run: |
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"

          # Create comprehensive summary
          echo "# BSB Test Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** $RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "**Test Suite:** all" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Allure Reports" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [This Run Report](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/$RUN_ID/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [Latest Report](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📁 Test Artifacts (S3)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [Test Results](https://s3.console.aws.amazon.com/s3/buckets/flipper-aws-qa-tests/bsb/test-results/all/$RUN_ID/)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [All BSB Reports](https://s3.console.aws.amazon.com/s3/buckets/flipper-aws-qa-tests/bsb/allure-reports/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [All Test Suites - Latest Reports](https://s3.console.aws.amazon.com/s3/buckets/flipper-aws-qa-tests/bsb/allure-reports/)" >> $GITHUB_STEP_SUMMARY
          echo "- [CLI Tests - Latest](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/cli/latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [Frontend Tests - Latest](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/frontend/latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [All Tests - Latest](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/latest/index.html)" >> $GITHUB_STEP_SUMMARY

      - name: Install Playwright automation dependencies
        if: always()
        run: |
          cd scripts/testing/playwright-automation
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install Playwright browsers
        if: always()
        run: |
          cd scripts/testing/playwright-automation
          playwright install-deps
          playwright install chromium firefox webkit
          
      - name: Run Playwright automation tests (All Browsers)
        if: always()
        run: |
          cd scripts/testing/playwright-automation
          python3 -m pytest -m ui \
            --browser=chromium --browser=firefox --browser=webkit \
            --base-url=http://10.0.4.20 \
            --tb=short \
            --maxfail=5 \
            --reruns=1 \
            --reruns-delay=3 \
            --capture=no \
            -v
        continue-on-error: true
        env:
          CI: true
          ENVIRONMENT: ci
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
          
      - name: Update job summary with Playwright results
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎭 Playwright UI Automation Tests" >> $GITHUB_STEP_SUMMARY
          echo "Cross-browser validation of BUSY Bar web interface using \`-m ui\` marker:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Browsers Tested:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Chromium (Chrome-based) - Headless" >> $GITHUB_STEP_SUMMARY
          echo "- 🦊 Firefox (Mozilla) - Headless" >> $GITHUB_STEP_SUMMARY
          echo "- 🧭 WebKit (Safari-based) - Headless" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**UI Components Validated:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Page loading and DOM structure" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Navigation component (connection status, battery, IP)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Device display component (canvas/image fallback)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cross-browser selector compatibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Execution:** All browsers run simultaneously in headless mode" >> $GITHUB_STEP_SUMMARY
