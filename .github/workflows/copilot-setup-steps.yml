name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: "Checkout code"
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: "Skip LFS payloads"
              run: git lfs install --skip-smudge

            - name: "Update submodules"
              run: |
                  set -euo pipefail
                  args=(--init --recursive --depth 1 --filter=blob:none --jobs="$(nproc)")
                  attempt=0
                  until timeout 600 git submodule update "${args[@]}"; do
                    attempt=$((attempt + 1))
                    if (( attempt >= 3 )); then
                      echo "submodule update failed after ${attempt} attempts"
                      exit 1
                    fi
                    echo "submodule update attempt ${attempt}/3 failed; retrying in $((attempt * 15))s"
                    sleep "$((attempt * 15))"
                  done
