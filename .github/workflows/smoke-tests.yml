name: 'Smoke tests'

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      update_url:
        required: false
        type: string
      default_target:
        required: false
        type: string
        default: '21'
      upload_to_testops:
        required: false
        type: boolean
        default: true

  # Manual trigger
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - cli
        - frontend
      upload_to_testops:
        description: 'Upload results to Allure TestOps'
        required: false
        default: true
        type: boolean
      launch_name:
        description: 'Custom launch name for TestOps'
        required: false
        default: 'GitHub Actions Run'
        type: string

# removed to see if trigger in build will work
#  # Scheduled runs (daily at 2 AM UTC)
#  schedule:
#    - cron: '0 2 * * *'
#
#  push:
#    branches:
#      - dev
#      - doom/testops-integration-tests # TODO: delete after undrafting!
#    tags:
#      - '*'

jobs:
  run_units_on_bench:
    name: Run BSB Tests
    runs-on: BusyBarTest

    strategy:
      matrix:
        python-version: [ 3.11 ]
        # For workflow_dispatch: run selected test suite
        # For workflow_call and other triggers: always run 'all'
        test-suite: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.test_suite)) || fromJSON('["all"]') }}

    env:
      # Set markers based on test suite
      PYTEST_MARKERS: ${{ matrix.test-suite == 'cli' && '-m cli' || (matrix.test-suite == 'frontend' && '-m frontend' || '') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ inputs.commit_sha }}

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) scripts/toolchain fbt_layers/fbtng

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Poetry removed - using pip with requirements.txt instead

      - name: 'Download update package'
        run: |
          echo "Using URL: $URL"
          URL="https://update.flipperzero.one/builds/busybar-firmware/${{ inputs.update_url }}"
          curl --fail -L -o busybar-f${{ inputs.default_target }}-update.tar "$URL"
          mkdir -p update_bundle
          tar -xf busybar-f${{ inputs.default_target }}-update.tar -C update_bundle

      - name: 'Flash firmware'
        id: flashing
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/storage.py -p 10.0.4.20 send update_bundle /ext/tmp/upd_bundle
          expect -c 'spawn telnet 10.0.4.20 23; expect ">:"; send "update install /ext/tmp/upd_bundle/update.json\r\r"; interact'
          sleep 1
          python3 scripts/testops.py wait -t 240

      - name: Load cached venv
        id: cached-pip-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements.txt

#      - name: Run setup verification
#        run: |
#          cd tests
#          python3 setup.py
#        env:
#          CLI_HOST: ${{ secrets.CLI_HOST || 'busybar.local' }}
#          CLI_PORT: ${{ secrets.CLI_PORT || '23' }}
#          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'http://10.0.4.20/' }}

      - name: Run tests
        run: |
          cd tests
          python3 -m pytest . ${{ env.PYTEST_MARKERS }} -v \
            --alluredir=allure-results \
            --clean-alluredir \
            --tb=short \
            --junitxml=test-results.xml
        continue-on-error: true
        env:
          CLI_HOST: ${{ secrets.CLI_HOST || '10.0.4.20' }} #was busybar.local
          CLI_PORT: ${{ secrets.CLI_PORT || '23' }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'http://10.0.4.20' }}
          LOG_LEVEL: INFO
          LOG_TO_FILE: true

      #setup is temporary
      - name: Setup allurectl
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testops != 'false' }}
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ secrets.ALLURE_TESTOPS_URL }}
          allure-token: ${{ secrets.ALLURE_TESTOPS_TOKEN }}
          allure-project-id: ${{ secrets.ALLURE_PROJECT_ID }}

      - name: Upload test results to Allure TestOps
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testops != 'false' }}
        run: |
          cd tests
          echo "Attempting upload with command:"
          echo "allurectl upload allure-results --endpoint https://flipper.testops.cloud --token ${{ secrets.ALLURE_TESTOPS_TOKEN }} --project-id 232 --launch-name 'GitHub Actions - ${{ github.workflow }} - ${{ github.sha }}'"

          # Try the upload
          allurectl upload allure-results \
            --endpoint "${{ secrets.ALLURE_TESTOPS_URL }}" \
            --token "${{ secrets.ALLURE_TESTOPS_TOKEN }}" \
            --project-id "${{ secrets.ALLURE_PROJECT_ID }}" \
            --launch-name "GitHub Actions - ${{ github.workflow }} - ${{ github.sha }}"

          # Check the exit code
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "Upload successful!"
            echo "View results: ${{ secrets.ALLURE_TESTOPS_URL }}/project/${{ secrets.ALLURE_PROJECT_ID }}"
          else
            echo "Upload failed with exit code: $exit_code"
            exit $exit_code
          fi


      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Upload test results to S3
        run: |
          cd tests
          # Create unique path for this test run with project prefix
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"
          S3_PATH="s3://flipper-aws-qa-tests/bsb/test-results/${{ matrix.test-suite }}/$RUN_ID"

          # Upload test results
          aws s3 sync allure-results/ "$S3_PATH/allure-results/" --delete
          aws s3 cp test-results.xml "$S3_PATH/test-results.xml"

          # Upload logs if they exist
          if [ -d "logs" ]; then
            aws s3 sync logs/ "$S3_PATH/logs/" --delete
          fi

          echo "Test results uploaded to: $S3_PATH"

      - name: Set up Java (required for Allure report generation)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -zxf allure-2.32.0.tgz
          sudo mv allure-2.32.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Download previous Allure history from S3
        if: always()
        run: |
          cd tests
          # Download previous history if it exists
          HISTORY_PATH="s3://flipper-aws-qa-tests/bsb/allure-history/${{ matrix.test-suite }}"
          mkdir -p allure-history

          # Try to download existing history (ignore errors if it doesn't exist)
          aws s3 sync "$HISTORY_PATH/" allure-history/ || echo "No previous history found, starting fresh"
        continue-on-error: true

      - name: Generate Allure report with history
        if: always()
        run: |
          cd tests
          # Copy history to allure-results if it exists
          if [ -d "allure-history" ] && [ "$(ls -A allure-history)" ]; then
            cp -r allure-history/* allure-results/ 2>/dev/null || true
          fi

          # Generate report
          allure generate allure-results --clean -o allure-report

          # Extract history for next run
          mkdir -p allure-history-new
          if [ -d "allure-report/history" ]; then
            cp -r allure-report/history/* allure-history-new/ 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Upload Allure report and history to S3
        if: always()
        run: |
          cd tests
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"

          # Upload the complete report
          REPORT_PATH="s3://flipper-aws-qa-tests/bsb/allure-reports/${{ matrix.test-suite }}/$RUN_ID"
          PUBLIC_URL="https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/${{ matrix.test-suite }}/$RUN_ID/index.html"
          aws s3 sync allure-report/ "$REPORT_PATH/" --delete

          # Upload latest report as "latest" for easy access
          LATEST_PATH="s3://flipper-aws-qa-tests/bsb/allure-reports/${{ matrix.test-suite }}/latest"
          LATEST_PUBLIC_URL="https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/${{ matrix.test-suite }}/latest/index.html"
          aws s3 sync allure-report/ "$LATEST_PATH/" --delete

          # Upload history for next run
          if [ -d "allure-history-new" ] && [ "$(ls -A allure-history-new)" ]; then
            HISTORY_PATH="s3://flipper-aws-qa-tests/bsb/allure-history/${{ matrix.test-suite }}"
            aws s3 sync allure-history-new/ "$HISTORY_PATH/" --delete
          fi

          echo "Allure report uploaded to: $REPORT_PATH"
          echo "Latest report available at: $LATEST_PATH"

          # Add links to GitHub step summary
          echo "## Allure Reports (${{ matrix.test-suite }})" >> $GITHUB_STEP_SUMMARY
          echo "- [This Run ($RUN_ID)]($PUBLIC_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- [Latest Report]($LATEST_PUBLIC_URL)" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Create Job Summary
        if: always()
        run: |
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"

          # Create comprehensive summary
          echo "# BSB Test Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** $RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "**Test Suite:** ${{ matrix.test-suite }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Allure Reports" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [This Run Report](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/${{ matrix.test-suite }}/$RUN_ID/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [Latest Report](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/${{ matrix.test-suite }}/latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📁 Test Artifacts (S3)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [Test Results](https://s3.console.aws.amazon.com/s3/buckets/flipper-aws-qa-tests/bsb/test-results/${{ matrix.test-suite }}/$RUN_ID/)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 [All BSB Reports](https://s3.console.aws.amazon.com/s3/buckets/flipper-aws-qa-tests/bsb/allure-reports/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [All Test Suites - Latest Reports](https://s3.console.aws.amazon.com/s3/buckets/flipper-aws-qa-tests/bsb/allure-reports/)" >> $GITHUB_STEP_SUMMARY
          echo "- [CLI Tests - Latest](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/cli/latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [Frontend Tests - Latest](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/frontend/latest/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [All Tests - Latest](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/latest/index.html)" >> $GITHUB_STEP_SUMMARY

  # Separate job for manual upload to TestOps
  upload-testops:
    name: Upload to Allure TestOps
    runs-on: self-hosted
    needs: run_units_on_bench
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_testops == 'true' }}

    steps:
    - name: Configure AWS CLI
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Download test results from S3
      run: |
        # Create workspace for downloaded results
        mkdir -p allure-results

        # Download results for all test suites from this run
        RUN_ID="${{ github.run_number }}-${{ github.sha }}"

        # Try to download from each test suite
        for suite in all cli frontend; do
          S3_PATH="s3://flipper-aws-qa-tests/bsb/test-results/$suite/$RUN_ID"
          echo "Attempting to download from: $S3_PATH"
          aws s3 sync "$S3_PATH/allure-results/" allure-results/ || echo "No results found for $suite"
        done

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    # Poetry removed - using pip with requirements.txt instead

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Upload to Allure TestOps
      run: |
        allurectl upload allure-results \
          --token ${{ secrets.ALLURE_TESTOPS_TOKEN }} \
          --endpoint ${{ secrets.ALLURE_TESTOPS_URL }} \
          --project-id ${{ secrets.ALLURE_PROJECT_ID }} \
          --launch-name "${{ github.event.inputs.launch_name || 'GitHub Actions - ${{ github.workflow }} - ${{ github.sha }}' }}"
      env:
        ALLURE_TESTOPS_TOKEN: ${{ secrets.ALLURE_TESTOPS_TOKEN }}
