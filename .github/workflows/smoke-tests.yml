name: 'Smoke tests'

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      update_url:
        required: false
        type: string
      default_target:
        required: false
        type: string
        default: '21'
      upload_to_testops:
        required: false
        type: boolean
        default: true

  # Manual trigger
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - cli
        - frontend
      upload_to_testops:
        description: 'Upload results to Allure TestOps'
        required: false
        default: true
        type: boolean
      launch_name:
        description: 'Custom launch name for TestOps'
        required: false
        default: 'GitHub Actions Run'
        type: string

# removed to see if trigger in build will work
#  # Scheduled runs (daily at 2 AM UTC)
#  schedule:
#    - cron: '0 2 * * *'
#
#  push:
#    branches:
#      - dev
#      - doom/testops-integration-tests # TODO: delete after undrafting!
#    tags:
#      - '*'

jobs:
  run_units_on_bench:
    name: Run BSB Tests
    runs-on: BusyBarTest

    strategy:
      matrix:
        python-version: [ 3.11 ]
        # For workflow_dispatch: run selected test suite
        # For workflow_call and other triggers: always run 'all'
        test-suite: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.test_suite)) || fromJSON('["all"]') }}

    env:
      # Set markers based on test suite
      PYTEST_MARKERS: ${{ matrix.test-suite == 'cli' && '-m cli' || (matrix.test-suite == 'frontend' && '-m frontend' || '') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ inputs.commit_sha }}

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) scripts/toolchain fbt_layers/fbtng

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Poetry removed - using pip with requirements.txt instead

      - name: 'Download update package'
        run: |
          echo "Using URL: $URL"
          URL="https://update.flipperzero.one/builds/busybar-firmware/${{ inputs.update_url }}"
          curl --fail -L -o busybar-f${{ inputs.default_target }}-update.tar "$URL"
          mkdir -p update_bundle
          tar -xf busybar-f${{ inputs.default_target }}-update.tar -C update_bundle

      - name: 'Flash firmware'
        id: flashing
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/storage.py -p 10.0.4.20 send update_bundle /ext/tmp/upd_bundle
          expect -c 'spawn telnet 10.0.4.20 23; expect ">:"; send "update install /ext/tmp/upd_bundle/update.json\r\r"; interact'
          sleep 1
          python3 scripts/testops.py wait -t 240

      - name: Load cached venv
        id: cached-pip-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements.txt

#      - name: Run setup verification
#        run: |
#          cd tests
#          python3 setup.py
#        env:
#          CLI_HOST: ${{ secrets.CLI_HOST || 'busybar.local' }}
#          CLI_PORT: ${{ secrets.CLI_PORT || '23' }}
#          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'http://10.0.4.20/' }}

      - name: Run tests
        run: |
          cd tests
          python3 -m pytest . ${{ env.PYTEST_MARKERS }} -v \
            --alluredir=allure-results \
            --clean-alluredir \
            --tb=short \
            --junitxml=test-results.xml
        continue-on-error: true
        env:
          CLI_HOST: ${{ secrets.CLI_HOST || '10.0.4.20' }} #was busybar.local
          CLI_PORT: ${{ secrets.CLI_PORT || '23' }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'http://10.0.4.20' }}
          LOG_LEVEL: INFO
          LOG_TO_FILE: true

#setup is temporary
      - name: Setup allurectl
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testops != 'false' }}
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ vars.ALLURE_TESTOPS_URL || 'https://flipper.testops.cloud' }}
          allure-token: ${{ secrets.ALLURE_TESTOPS_TOKEN }}
          allure-project-id: ${{ vars.ALLURE_PROJECT_ID || '232' }}

      - name: Debug before upload
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testops != 'false' }}
        run: |
          cd tests
          echo "=== Directory check ==="
          pwd
          ls -la
          echo "=== Allure results check ==="
          ls -la allure-results/ || echo "allure-results directory not found"
          echo "=== Network test ==="
          curl -I https://flipper.testops.cloud || echo "Cannot reach endpoint"
          echo "=== Token test (first 5 chars) ==="
          echo "${ALLURE_TESTOPS_TOKEN:0:5}..."
          echo "${{ vars.ALLURE_TESTOPS_URL || 'https://flipper.testops.cloud' }}"
          echo "${{ vars.ALLURE_PROJECT_ID || '232' }}"
        env:
          ALLURE_TESTOPS_TOKEN: ${{ secrets.ALLURE_TESTOPS_TOKEN }}

      - name: Upload test results to Allure TestOps
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.upload_to_testops != 'false' }}
        run: |
          cd tests
          allurectl upload allure-results \
            --token "${{ secrets.ALLURE_TESTOPS_TOKEN }}" \
            --endpoint "https://flipper.testops.cloud" \
            --project-id "232" \
            --launch-name "GitHub Actions - ${{ github.workflow }} - ${{ github.sha }}"

      - name: Upload test results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-suite }}-${{ github.run_number }}
          path: |
            tests/allure-results/
            tests/test-results.xml
            tests/logs/
          retention-days: 30

      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -zxf allure-2.32.0.tgz
          sudo mv allure-2.32.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        if: always()
        run: |
          cd tests
          allure generate allure-results --clean -o allure-report
        continue-on-error: true

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.test-suite }}-${{ github.run_number }}
          path: tests/allure-report/
          retention-days: 30

  # Separate job for manual upload to TestOps
  upload-testops:
    name: Upload to Allure TestOps
    runs-on: self-hosted
    needs: run_units_on_bench
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_testops == 'true' }}

    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*-${{ github.run_number }}
        merge-multiple: true

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    # Poetry removed - using pip with requirements.txt instead

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Upload to Allure TestOps
      run: |
        allurectl upload allure-results \
          --token ${{ secrets.ALLURE_TESTOPS_TOKEN }} \
          --endpoint ${{ vars.ALLURE_TESTOPS_URL || 'https://flipper.testops.cloud' }} \
          --project-id ${{ vars.ALLURE_PROJECT_ID || '232' }} \
          --launch-name "${{ github.event.inputs.launch_name || 'GitHub Actions - ${{ github.workflow }} - ${{ github.sha }}' }}"
      env:
        ALLURE_TESTOPS_TOKEN: ${{ secrets.ALLURE_TESTOPS_TOKEN }}