name: Delete refs from mirrors

on:
  delete:

jobs:
  purge:
    name: Ref cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup
        run: |
          git remote add forgejo "https://${{ secrets.REPO_MIRROR_TOKEN }}@${{ vars.REPO_MIRROR_URL }}"
          git push --delete forgejo ${{ github.ref }} || true
