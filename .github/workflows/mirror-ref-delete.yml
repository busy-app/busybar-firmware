name: Delete refs from mirrors

on:
  delete:

jobs:
  purge:
    if: github.event.ref_type == 'branch'
    name: Branch cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup for branch ${{ github.event.ref}}
        run: |
          git remote add forgejo "https://${{ secrets.REPO_MIRROR_TOKEN }}@${{ vars.REPO_MIRROR_URL }}"
          git push --delete forgejo ${{ github.event.ref }} || true
