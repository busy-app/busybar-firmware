name: 'Lint sources'

on:
  pull_request:

env:
  SET_GH_OUTPUT: 1

jobs:
  lint_sources_check_submodules:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Configure Git and LFS for submodules'
        run: |
          # Configure Git LFS
          git lfs install --skip-smudge
          
          # Set up authentication for GitHub repositories at repo level
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
          git config credential.helper 'store --file ~/.git-credentials'
          
          # Configure LFS settings
          git config lfs.transfer.maxretries 3

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) scripts/toolchain lib/lwip lib/matter_ext || (git lfs logs last && exit 1)

      - name: 'Check C/C++ code formatting for f21 and f64'
        id: syntax_check_cpp
        if: always()
        run: |
          set +e;
          export FBT_GIT_SUBMODULE_SHALLOW=1;
          errors=0;
          for target in 21 64; do
            log_file="lint-cpp-${target}.log";
            echo "::group::Lint TARGET_HW=${target}";
            bash ./fbt -s lint TARGET_HW=${target} 2>&1 | tee "${log_file}";
            status=${PIPESTATUS[0]};
            echo "::endgroup::";
            if [ "${status}" -ne 0 ]; then
              errors=1;
              printf "C Lint errors (TARGET_HW=%s):\n\`\`\`\n" "${target}" >> $GITHUB_STEP_SUMMARY;
              cat "${log_file}" >> $GITHUB_STEP_SUMMARY;
              printf "\n\`\`\`\n" >> $GITHUB_STEP_SUMMARY;
            else
              printf "C Lint (TARGET_HW=%s): all good ✨\n" "${target}" >> $GITHUB_STEP_SUMMARY;
            fi
          done
          if [ "${errors}" -ne 0 ]; then
            echo "errors=1" >> $GITHUB_OUTPUT;
            exit 1;
          fi

      - name: 'Check Python code formatting for f21 and f64'
        id: syntax_check_py
        # if: always()
        if: false
        run: |
          set +e;
          export FBT_GIT_SUBMODULE_SHALLOW=1;
          errors=0;
          for target in 21 64; do
            log_file="lint-py-${target}.log";
            echo "::group::Lint_py TARGET_HW=${target}";
            bash ./fbt -s lint_py TARGET_HW=${target} 2>&1 | tee "${log_file}";
            status=${PIPESTATUS[0]};
            echo "::endgroup::";
            if [ "${status}" -ne 0 ]; then
              errors=1;
              printf "Python Lint errors (TARGET_HW=%s):\n\`\`\`\n" "${target}" >> $GITHUB_STEP_SUMMARY;
              cat "${log_file}" >> $GITHUB_STEP_SUMMARY;
              printf "\n\`\`\`\n" >> $GITHUB_STEP_SUMMARY;
            else
              printf "Python Lint (TARGET_HW=%s): all good ✨\n" "${target}" >> $GITHUB_STEP_SUMMARY;
            fi
          done
          if [ "${errors}" -ne 0 ]; then
            echo "errors=1" >> $GITHUB_OUTPUT;
            exit 1;
          fi

      - name: 'Report code formatting errors'
        if: (steps.syntax_check_cpp.outputs.errors || steps.syntax_check_py.outputs.errors) && github.event.pull_request
        run: |
          echo "Code formatting errors found";
          echo "Please run './fbt format' or './fbt format_py' to fix them";
          exit 1;
