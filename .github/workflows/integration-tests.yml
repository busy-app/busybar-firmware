name: 'Local API tests'

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      update_url:
        required: true
        type: string
        description: 'Relative path to firmware update file'
      target:
        required: false
        type: string
        default: '21'

  workflow_dispatch:
    inputs:
      firmware_branch:
        description: 'Firmware branch (e.g., dev, 0.6.0-rc). Will auto-detect latest build.'
        required: false
        type: string
        default: "dev"
      update_url:
        description: 'Explicit firmware path (overrides firmware_branch if set)'
        required: false
        type: string
        default: ""
      target:
        description: 'Hardware target'
        required: false
        type: string
        default: '21'

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

env:
  U5_HW_TARGET: ${{ inputs.target || '21' }}

jobs:
  integration-tests:
    runs-on: BusyBarTest
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Configure Git and LFS for submodules'
        run: |
          git lfs install --skip-smudge
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
          git config credential.helper 'store --file ~/.git-credentials'
          git config lfs.transfer.maxretries 3

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) scripts/toolchain fbt_layers/fbtng || (git lfs logs last && exit 1)

      - name: 'Resolve firmware URLs'
        id: resolve_firmware
        run: |
          set -euo pipefail
          BASE_URL="https://update.flipperzero.one/builds/busybar-firmware"
          TARGET="f${{ env.U5_HW_TARGET }}"

          if [ -n "${{ inputs.update_url }}" ]; then
            # Explicit URL provided via workflow_call or workflow_dispatch
            UPDATE_PATH="${{ inputs.update_url }}"
            echo "Using explicit path: $UPDATE_PATH"
          elif [ -n "${{ github.event.inputs.firmware_branch }}" ]; then
            # Auto-detect latest build from branch/tag (workflow_dispatch only)
            BRANCH="${{ github.event.inputs.firmware_branch }}"
            echo "Resolving latest build for branch: $BRANCH"

            # Fetch directory listing and find latest update file
            LISTING=$(curl -sL "${BASE_URL}/${BRANCH}/")
            UPDATE_FILE=$(echo "$LISTING" | grep -oE "busybar-${TARGET}-update-[^\"]+\.(tgz|tar)" | sort -V | tail -1)

            if [ -z "$UPDATE_FILE" ]; then
              echo "ERROR: Could not find update file for branch $BRANCH"
              exit 1
            fi

            UPDATE_PATH="${BRANCH}/${UPDATE_FILE}"
            echo "Found latest: $UPDATE_PATH"
          else
            echo "ERROR: No update_url or firmware_branch provided"
            exit 1
          fi

          # Derive ELF paths from update path (U5 and Si917)
          # Replace only in filename, not in directory part (branch name may contain -update-)
          UPDATE_DIR="$(dirname "$UPDATE_PATH")"
          UPDATE_FILE="$(basename "$UPDATE_PATH")"

          U5_ELF_FILE="${UPDATE_FILE/-update-/-firmware-}"
          U5_ELF_FILE="${U5_ELF_FILE%.tgz}"
          U5_ELF_FILE="${U5_ELF_FILE%.tar}.elf"
          U5_ELF_PATH="${UPDATE_DIR}/${U5_ELF_FILE}"

          SI917_ELF_FILE="${UPDATE_FILE/-update-/-sil_firmware-}"
          SI917_ELF_FILE="${SI917_ELF_FILE%.tgz}"
          SI917_ELF_FILE="${SI917_ELF_FILE%.tar}.elf"
          SI917_ELF_PATH="${UPDATE_DIR}/${SI917_ELF_FILE}"

          echo "update_url=${BASE_URL}/${UPDATE_PATH}" >> $GITHUB_OUTPUT
          echo "u5_elf_url=${BASE_URL}/${U5_ELF_PATH}" >> $GITHUB_OUTPUT
          echo "si917_elf_url=${BASE_URL}/${SI917_ELF_PATH}" >> $GITHUB_OUTPUT
          echo "Update URL: ${BASE_URL}/${UPDATE_PATH}"
          echo "U5 ELF URL: ${BASE_URL}/${U5_ELF_PATH}"
          echo "Si917 ELF URL: ${BASE_URL}/${SI917_ELF_PATH}"

      - name: 'Download update package'
        run: |
          set -euo pipefail
          echo "Downloading: ${{ steps.resolve_firmware.outputs.update_url }}"
          curl --fail -L -o busybar-f${{ env.U5_HW_TARGET }}-update.tgz "${{ steps.resolve_firmware.outputs.update_url }}"

      - name: 'Download firmware ELF files for crash tracing'
        run: |
          set -euo pipefail
          mkdir -p /_work/elf

          echo "Downloading U5 ELF: ${{ steps.resolve_firmware.outputs.u5_elf_url }}"
          curl --fail -L -o /_work/elf/busybar-f${{ env.U5_HW_TARGET }}-firmware.elf "${{ steps.resolve_firmware.outputs.u5_elf_url }}"

          echo "Downloading Si917 ELF: ${{ steps.resolve_firmware.outputs.si917_elf_url }}"
          curl --fail -L -o /_work/elf/busybar-f${{ env.U5_HW_TARGET }}-sil_firmware.elf "${{ steps.resolve_firmware.outputs.si917_elf_url }}"

          echo "ELF files downloaded to /_work/elf/"
          ls -la /_work/elf/

      - name: 'Flash firmware'
        id: flashing
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py format --no-confirm
          python3 scripts/testops.py update-fw busybar-f${{ env.U5_HW_TARGET }}-update.tgz -r 3 --connect-timeout 10
          python3 scripts/testops.py wait -t 260

      - name: 'Sanity check after flashing'
        if: ${{ steps.flashing.outcome == 'success' }}
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py sanity

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run smoke tests
        id: smoke_tests
        run: |
          set +e
          cd tests
          python3 -m pytest . -v \
            --alluredir=allure-results \
            --clean-alluredir \
            --junitxml=test-results.xml
          PYTEST_EXIT=$?
          # 0 = all passed, 1 = some failed — both mean tests ran successfully
          # 2+ = collection error, internal error, no tests collected, etc.
          if [ $PYTEST_EXIT -ge 2 ]; then
            echo "Pytest failed to run properly (exit code $PYTEST_EXIT)"
            exit $PYTEST_EXIT
          fi
        env:
          BSB_FIRMWARE_PATH: ${{ github.workspace }}
          CLI_HOST: ${{ secrets.CLI_HOST || '10.0.4.20' }}
          CLI_PORT: ${{ secrets.CLI_PORT || '23' }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'http://10.0.4.20' }}
          LOG_LEVEL: INFO
          LOG_TO_FILE: true

      - name: Setup allurectl
        if: always()
        continue-on-error: true
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ secrets.ALLURE_TESTOPS_URL }}
          allure-token: ${{ secrets.ALLURE_TESTOPS_TOKEN }}
          allure-project-id: ${{ secrets.ALLURE_PROJECT_ID }}

      - name: Upload test results to Allure TestOps
        id: allure_upload
        if: always()
        continue-on-error: true
        run: |
          cd tests
          OUTPUT=$(allurectl upload allure-results \
            --endpoint "${{ secrets.ALLURE_TESTOPS_URL }}" \
            --token "${{ secrets.ALLURE_TESTOPS_TOKEN }}" \
            --project-id "${{ secrets.ALLURE_PROJECT_ID }}" \
            --launch-name "BSB Firmware - Integration Tests - ${{ inputs.branch_name || github.head_ref || github.ref_name }} - ${GITHUB_SHA::7}" 2>&1) || true
          echo "$OUTPUT"
          LAUNCH_ID=$(echo "$OUTPUT" | grep -oP 'Launch \[\K[0-9]+' | head -1)
          if [ -n "$LAUNCH_ID" ]; then
            echo "allure_launch_url=${{ secrets.ALLURE_TESTOPS_URL }}/launch/$LAUNCH_ID" >> $GITHUB_OUTPUT
          fi

      - name: 'Configure AWS CLI'
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: 'Upload runner logs to S3'
        if: always()
        run: |
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"
          LOG_FILE="$RUNNER_LOG_DIR/latest/runlog.log"
          S3_PATH="s3://flipper-aws-qa-tests/bsb/runner-logs/integration-tests/$RUN_ID/runlog.log"
          PUBLIC_URL="https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/runner-logs/integration-tests/$RUN_ID/runlog.log"

          if [ -f "$LOG_FILE" ]; then
            aws s3 cp "$LOG_FILE" "$S3_PATH"
            echo "## 📋 Runner Logs" >> $GITHUB_STEP_SUMMARY
            echo "- [runlog.log]($PUBLIC_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Log file not found: $LOG_FILE"
          fi

      - name: Comment PR with failed tests
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUNIT_XML: tests/test-results.xml
          ALLURE_URL: ${{ steps.allure_upload.outputs.allure_launch_url }}
        run: |
          set -euo pipefail

          # Parse JUnit XML and build markdown comment
          COMMENT_BODY=$(python3 -c "
          import xml.etree.ElementTree as ET, sys, os

          xml_path = os.environ['JUNIT_XML']
          if not os.path.exists(xml_path):
              print('> **Integration Tests**: results file not found')
              sys.exit(0)

          tree = ET.parse(xml_path)
          root = tree.getroot()

          # pytest 7+ uses <testsuites> root with <testsuite> children
          total = failures = errors = skipped = 0
          for suite in root.iter('testsuite'):
              total += int(suite.attrib.get('tests', 0))
              failures += int(suite.attrib.get('failures', 0))
              errors += int(suite.attrib.get('errors', 0))
              skipped += int(suite.attrib.get('skipped', 0))
          passed = total - failures - errors - skipped

          failed_tests = []
          for tc in root.iter('testcase'):
              fail = tc.find('failure')
              err = tc.find('error')
              if fail is not None or err is not None:
                  name = tc.attrib.get('classname', '') + '::' + tc.attrib.get('name', '')
                  msg = (fail if fail is not None else err).attrib.get('message', '')[:200]
                  failed_tests.append((name, msg))

          allure_url = os.environ.get('ALLURE_URL', '')
          lines = []
          if failures + errors == 0:
              header = f'### Integration Tests: all {passed} passed'
          else:
              header = f'### Integration Tests: {failures + errors} failed / {passed} passed / {total} total'
          lines.append(header)

          if allure_url:
              lines.append(f'[Allure Report]({allure_url})')

          if failed_tests:
              lines.append('')
              lines.append('<details>')
              lines.append(f'<summary>{len(failed_tests)} failed tests</summary>')
              lines.append('')
              lines.append('| Test | Error |')
              lines.append('|------|-------|')
              for name, msg in failed_tests[:30]:
                  safe_msg = msg.replace('|', '\\\\|').replace('\n', ' ')
                  lines.append(f'| \`{name}\` | {safe_msg} |')
              if len(failed_tests) > 30:
                  lines.append(f'| ... | +{len(failed_tests) - 30} more |')
              lines.append('')
              lines.append('</details>')

          print('\n'.join(lines))
          ")

          # Find and update existing comment or create new one
          PR_NUMBER="${{ github.event.pull_request.number }}"
          MARKER="### Integration Tests:"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -f body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
          fi

      - name: Create Job Summary
        if: always()
        run: |
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"
          BRANCH_NAME="${{ inputs.branch_name || github.head_ref || github.ref_name }}"

          echo "# BSB Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** $RUN_ID | **Branch:** $BRANCH_NAME | **Commit:** \`${{ inputs.commit_sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Firmware:** ${{ steps.resolve_firmware.outputs.update_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests:** ${{ steps.smoke_tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [Allure TestOps](${{ secrets.ALLURE_TESTOPS_URL }}/project/${{ secrets.ALLURE_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "- [This Run Report](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/$RUN_ID/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [Latest Report](https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/allure-reports/all/latest/index.html)" >> $GITHUB_STEP_SUMMARY

      - name: 'Comment PR on crash'
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CRASH_FLAG="$RUNNER_LOG_DIR/latest/crash_detected.flag"
          [ -f "$CRASH_FLAG" ] || exit 0

          RUN_ID="${{ github.run_number }}-${{ github.sha }}"
          PUBLIC_BASE="https://flipper-aws-qa-tests.s3.eu-central-1.amazonaws.com/bsb/runner-logs/integration-tests/$RUN_ID"

          PROCESSOR=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['processor'])" "$CRASH_FLAG")
          TRACE_STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['trace_status'])" "$CRASH_FLAG")
          CRASH_LINE=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['crash_line'][:3000])" "$CRASH_FLAG")

          TRACE_LINKS=""
          for trace_file in "$RUNNER_LOG_DIR/latest"/crash_trace_*.log; do
            [ -f "$trace_file" ] || continue
            BASENAME=$(basename "$trace_file")
            TRACE_LINKS="${TRACE_LINKS}- [${BASENAME}](${PUBLIC_BASE}/${BASENAME})"$'\n'
          done

          read -r -d '' COMMENT_BODY <<EOF || true
          ### 🚨 Crash Detected (${PROCESSOR})

          **Trace status:** ${TRACE_STATUS} | **Runner:** ${RUNNER_NAME}

          <details>
          <summary>Crash log</summary>

          \`\`\`
          ${CRASH_LINE}
          \`\`\`

          </details>

          **Traces:**
          ${TRACE_LINKS}
          [Runner log](${PUBLIC_BASE}/runlog.log)
          EOF

          PR_NUMBER="${{ github.event.pull_request.number }}"
          MARKER="### 🚨 Crash Detected"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -f body="$COMMENT_BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
          fi
