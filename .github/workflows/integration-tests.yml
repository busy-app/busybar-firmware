name: 'Integration Tests'

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      update_url:
        required: true
        type: string
        description: 'Relative path to firmware update file'
      target:
        required: false
        type: string
        default: '21'

  workflow_dispatch:
    inputs:
      firmware_branch:
        description: 'Firmware branch (e.g., dev, 0.6.0-rc). Will auto-detect latest build.'
        required: false
        type: string
        default: "dev"
      update_url:
        description: 'Explicit firmware path (overrides firmware_branch if set)'
        required: false
        type: string
        default: ""
      target:
        description: 'Hardware target'
        required: false
        type: string
        default: '21'

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

env:
  U5_HW_TARGET: ${{ inputs.target || '21' }}
  FIRMWARE_BASE_URL: https://update.flipperzero.one/builds/busybar-firmware

jobs:
  integration-tests:
    runs-on: BusyBarTest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Configure Git and LFS for submodules'
        run: |
          git lfs install --skip-smudge
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
          git config credential.helper 'store --file ~/.git-credentials'
          git config lfs.transfer.maxretries 3

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) scripts/toolchain fbt_layers/fbtng || (git lfs logs last && exit 1)

      - name: 'Resolve firmware URLs'
        id: resolve_firmware
        run: |
          set -euo pipefail
          TARGET="f${{ env.U5_HW_TARGET }}"

          if [ -n "${{ inputs.update_url }}" ]; then
            UPDATE_PATH="${{ inputs.update_url }}"
          elif [ -n "${{ github.event.inputs.firmware_branch }}" ]; then
            BRANCH="${{ github.event.inputs.firmware_branch }}"
            LISTING=$(curl -sL "${FIRMWARE_BASE_URL}/${BRANCH}/")
            UPDATE_FILE=$(echo "$LISTING" | grep -oE "busybar-${TARGET}-update-[^\"]+\.(tgz|tar)" | sort -V | tail -1)
            [ -n "$UPDATE_FILE" ] || { echo "ERROR: No update file for branch $BRANCH"; exit 1; }
            UPDATE_PATH="${BRANCH}/${UPDATE_FILE}"
          else
            echo "ERROR: No update_url or firmware_branch provided"; exit 1
          fi

          UPDATE_DIR="$(dirname "$UPDATE_PATH")"
          UPDATE_FILE="$(basename "$UPDATE_PATH")"

          U5_ELF="${UPDATE_DIR}/${UPDATE_FILE/-update-/-firmware-}"
          U5_ELF="${U5_ELF%.tgz}"; U5_ELF="${U5_ELF%.tar}.elf"

          SI917_ELF="${UPDATE_DIR}/${UPDATE_FILE/-update-/-sil_firmware-}"
          SI917_ELF="${SI917_ELF%.tgz}"; SI917_ELF="${SI917_ELF%.tar}.elf"

          echo "update_url=${FIRMWARE_BASE_URL}/${UPDATE_PATH}" >> $GITHUB_OUTPUT
          echo "u5_elf_url=${FIRMWARE_BASE_URL}/${U5_ELF}" >> $GITHUB_OUTPUT
          echo "si917_elf_url=${FIRMWARE_BASE_URL}/${SI917_ELF}" >> $GITHUB_OUTPUT

      - name: 'Download firmware artifacts'
        run: |
          set -euo pipefail
          curl --fail -L -o busybar-f${{ env.U5_HW_TARGET }}-update.tgz \
            "${{ steps.resolve_firmware.outputs.update_url }}"

          mkdir -p /_work/elf
          curl --fail -L -o /_work/elf/busybar-f${{ env.U5_HW_TARGET }}-firmware.elf \
            "${{ steps.resolve_firmware.outputs.u5_elf_url }}"
          curl --fail -L -o /_work/elf/busybar-f${{ env.U5_HW_TARGET }}-sil_firmware.elf \
            "${{ steps.resolve_firmware.outputs.si917_elf_url }}"

      - name: 'Flash firmware'
        id: flashing
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py format --no-confirm
          python3 scripts/testops.py update-fw busybar-f${{ env.U5_HW_TARGET }}-update.tgz -r 3 --connect-timeout 10
          python3 scripts/testops.py wait -t 320

      - name: 'Sanity check after flashing'
        if: steps.flashing.outcome == 'success'
        run: |
          set -euo pipefail
          source scripts/toolchain/fbtenv.sh
          python3 scripts/testops.py sanity

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.11

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run integration tests
        id: smoke_tests
        timeout-minutes: 20
        env:
          BSB_FIRMWARE_PATH: ${{ github.workspace }}
          CLI_HOST: ${{ secrets.CLI_HOST || '10.0.4.20' }}
          CLI_PORT: ${{ secrets.CLI_PORT || '23' }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL || 'http://10.0.4.20' }}
          LOG_LEVEL: INFO
          LOG_TO_FILE: true
          RUN_SCHEMATHESIS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set +e
          cd tests
          PYTEST_MARK_ARGS=()
          if [ "$RUN_SCHEMATHESIS" != "true" ]; then
            PYTEST_MARK_ARGS=(-m "not schemathesis")
            echo "Skipping schemathesis tests (event=${{ github.event_name }}, ref=${{ github.ref }})"
          else
            echo "Running full suite including schemathesis"
          fi
          python3 -m pytest . -v \
            "${PYTEST_MARK_ARGS[@]}" \
            --alluredir=allure-results \
            --clean-alluredir \
            --junitxml=test-results.xml
          PYTEST_EXIT=$?
          echo "pytest_exit=$PYTEST_EXIT" >> $GITHUB_OUTPUT
          # 0 = all passed, 1 = some failed — both mean tests ran
          # 2+ = collection error, internal error, no tests collected
          if [ $PYTEST_EXIT -ge 2 ]; then
            echo "Pytest failed to run properly (exit code $PYTEST_EXIT)"
            exit $PYTEST_EXIT
          fi

      - name: Setup allurectl
        continue-on-error: true
        uses: allure-framework/setup-allurectl@2d89ee0b7ba2f59dbe9849b6df5763cab78e14db # v1.0.3
        with:
          allure-endpoint: ${{ secrets.ALLURE_TESTOPS_URL }}
          allure-token: ${{ secrets.ALLURE_TESTOPS_TOKEN }}
          allure-project-id: ${{ secrets.ALLURE_PROJECT_ID }}

      - name: Upload test results to Allure TestOps
        id: allure_upload
        continue-on-error: true
        run: |
          cd tests
          OUTPUT=$(allurectl upload allure-results \
            --endpoint "${{ secrets.ALLURE_TESTOPS_URL }}" \
            --token "${{ secrets.ALLURE_TESTOPS_TOKEN }}" \
            --project-id "${{ secrets.ALLURE_PROJECT_ID }}" \
            --launch-name "BSB Firmware - Integration Tests - ${{ inputs.branch_name || github.head_ref || github.ref_name }} - ${GITHUB_SHA::7}" 2>&1) || true
          echo "$OUTPUT"
          LAUNCH_ID=$(echo "$OUTPUT" | grep -oP 'Launch \[\K[0-9]+' | head -1)
          if [ -n "$LAUNCH_ID" ]; then
            echo "allure_launch_url=${{ secrets.ALLURE_TESTOPS_URL }}/launch/$LAUNCH_ID" >> $GITHUB_OUTPUT
          fi

      - name: 'Configure AWS CLI'
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: 'Upload runner logs to S3'
        run: |
          RUN_ID="${{ github.run_number }}-${{ github.sha }}"
          LOG_FILE="$RUNNER_LOG_DIR/latest/runlog.log"
          S3_PATH="s3://flipper-aws-qa-tests/bsb/runner-logs/integration-tests/$RUN_ID/runlog.log"

          if [ -f "$LOG_FILE" ]; then
            aws s3 cp "$LOG_FILE" "$S3_PATH"
          fi

      - name: 'Report test results'
        continue-on-error: true
        env:
          JUNIT_XML: tests/test-results.xml
          ALLURE_URL: ${{ steps.allure_upload.outputs.allure_launch_url }}
          FIRMWARE_URL: ${{ steps.resolve_firmware.outputs.update_url }}
          BRANCH_NAME: ${{ inputs.branch_name || github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tests/utils/report_test_results.py

      - name: 'Comment PR on crash'
        if: always() && github.event.pull_request.number
        continue-on-error: true
        env:
          CRASH_FLAG: ${{ env.RUNNER_LOG_DIR }}/latest/crash_detected.flag
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tests/utils/report_test_results.py
