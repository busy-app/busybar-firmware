name: Sync with mirror repo
on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sync:
    name: Push branch to mirror repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set appropriate branch name
        id: set_branch_name
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch_name=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
            # For PR events, fetch the source branch explicitly
            git fetch origin ${{ github.event.pull_request.head.ref }}:${{ github.event.pull_request.head.ref }}
          else
            echo "branch_name=${{ github.ref }}" >> $GITHUB_ENV
          fi

      - name: Sync with ${{ vars.REPO_MIRROR_URL }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote add forgejo "https://${{ secrets.REPO_MIRROR_TOKEN }}@${{ vars.REPO_MIRROR_URL }}"
          git push --force forgejo ${{ env.branch_name }}:refs/heads/${{ env.branch_name }}
