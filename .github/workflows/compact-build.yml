name: "Compact build"

on:
  push:
    branches:
      - dev
  pull_request:

env:
  FBT_GIT_SUBMODULE_SHALLOW: 0
  DEFAULT_TARGET_SPEC: 21_64
  FBT_TOOLCHAIN_PATH: /runner/_work

jobs:
  compact-build:
    runs-on: BsbShell
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        target_spec: ["21_64", "22_65"]
    outputs:
      default_target_spec: ${{ env.DEFAULT_TARGET_SPEC }}

    steps:
      - name: "Wipe workspace"
        run: |
          find ./ -mount -maxdepth 1 -exec rm -rf {} \;

      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build firmware artifacts"
        id: build-fw
        uses: ./.github/actions/build-artifacts
        with:
          target_spec: ${{ matrix.target_spec }}
          build_type: release
          artifact_path: artifacts
