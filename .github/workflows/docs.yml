name: 'Generate documentation with Doxygen'

on:
  push:
    branches:
      - dev
      - release
    tags:
      - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SET_GH_OUTPUT: 1

jobs:
  doxygen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Update submodules'
        run: |
          git submodule update --init --recursive --jobs=$(nproc) \
            fbt_layers/* \
            scripts/toolchain \
            documentation/doxygen/doxygen-awesome-css

      - name: install-doxygen
        uses: AdarshRawat1/Install-Doxygen@v1.0
        with:
          version: "1.12.0"

      - name: install-rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1
        with:
          version: v1.75.2

      - name: 'Generate documentation'
        id: doxygen_build
        if: always()
        run: |
          set +e;
          export FBT_NO_SYNC=1;
          errors=0;
          log_file="doxygen-build.log";
          echo "::group::Doxygen";
          bash ./fbt doxygen 2>&1 | tee "${log_file}";
          status=${PIPESTATUS[0]};
          echo "::endgroup::";
          if [ "${status}" -ne 0 ]; then
            errors=1;
            printf "Doxygen errors:\n\`\`\`\n" >> $GITHUB_STEP_SUMMARY;
            cat "${log_file}" >> $GITHUB_STEP_SUMMARY;
            printf "\n\`\`\`\n" >> $GITHUB_STEP_SUMMARY;
          else
            printf "Doxygen: all good ✨\n" >> $GITHUB_STEP_SUMMARY;
          fi
          if [ "${errors}" -ne 0 ]; then
            echo "errors=1" >> $GITHUB_OUTPUT;
            exit 1;
          fi

      - name: 'Report Doxygen errors'
        if: (steps.doxygen_build.outputs.errors) && github.event.pull_request
        run: |
          echo "Doxygen errors found";
          exit 1;

      - name: 'Upload documentation'
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/release')
        env:
          RCLONE_CONFIG: /dev/null
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.DOCS_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.DOCS_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.DOCS_S3_ENDPOINT_URL }}
          RCLONE_CONFIG_R2_REGION: auto
          S3_BUCKET: ${{ github.ref == 'refs/heads/release' && secrets.DOCS_S3_PROD_BUCKET || secrets.DOCS_S3_DEV_BUCKET }}
        run: |
          rclone sync documentation/doxygen/build/html/ "r2:${S3_BUCKET}" \
            --checksum --fast-list --transfers 64 --checkers 64 --stats 10s --stats-one-line --log-level INFO
